<style>
/* ============================================================
   Green Office Design System
   Color Palette:
     Primary Green (Olive):  #768b54
     Background / Cream:     #f5f0e6
     Forest Green:           #3a4f3b
     Pale Sage:              #e0e5df
     Darkest Green:          #1a2622
   ============================================================ */

/* --- CSS Variables --- */
:root {
  --color-primary: #768b54;
  --color-primary-light: #8fa568;
  --color-primary-dark: #5e7143;
  --color-bg: #f5f0e6;
  --color-forest: #3a4f3b;
  --color-sage: #e0e5df;
  --color-dark: #1a2622;
  --color-white: #ffffff;
  --color-overlay: rgba(26, 38, 34, 0.6);
  --color-glass: rgba(255, 255, 255, 0.75);
  --color-glass-border: rgba(255, 255, 255, 0.3);
  --color-error: #c0392b;
  --color-success: #27ae60;

  --font-family: 'Kanit', sans-serif;
  --shadow-sm: 0 2px 8px rgba(26, 38, 34, 0.08);
  --shadow-md: 0 4px 20px rgba(26, 38, 34, 0.12);
  --shadow-lg: 0 8px 40px rgba(26, 38, 34, 0.18);
  --shadow-glow: 0 0 20px rgba(118, 139, 84, 0.3);
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

/* --- Reset & Base --- */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  font-size: 16px;
  scroll-padding-top: 80px;
}

body {
  font-family: var(--font-family);
  background-color: var(--color-bg);
  color: var(--color-dark);
  line-height: 1.6;
  overflow-x: hidden;
  min-height: 100vh;
}

/* --- Loading Screen --- */
.loading-screen {
  position: fixed;
  inset: 0;
  background: var(--color-forest);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 10000;
  transition: opacity 0.6s ease, visibility 0.6s ease;
}

.loading-screen.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.loading-logo {
  font-size: 3rem;
  color: var(--color-white);
  font-weight: 700;
  margin-bottom: 1.5rem;
  animation: pulse 1.5s ease-in-out infinite;
}

.loading-spinner {
  width: 48px;
  height: 48px;
  border: 4px solid rgba(255, 255, 255, 0.2);
  border-top-color: var(--color-primary-light);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.7; transform: scale(0.97); }
}

/* --- Navbar --- */
.navbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  background: linear-gradient(135deg, var(--color-forest) 0%, var(--color-dark) 100%);
  box-shadow: var(--shadow-md);
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 2rem;
  backdrop-filter: blur(10px);
}

.nav-brand {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  color: var(--color-white);
  font-size: 1.35rem;
  font-weight: 600;
  text-decoration: none;
  letter-spacing: 0.5px;
}

.nav-brand-icon {
  font-size: 1.6rem;
}

.nav-menu {
  display: flex;
  align-items: center;
  gap: 0.25rem;
  list-style: none;
}

.nav-link {
  color: rgba(255, 255, 255, 0.8);
  text-decoration: none;
  padding: 0.5rem 1.15rem;
  border-radius: var(--radius-sm);
  font-weight: 400;
  font-size: 0.95rem;
  transition: var(--transition);
  cursor: pointer;
  position: relative;
}

.nav-link:hover,
.nav-link.active {
  color: var(--color-white);
  background: rgba(255, 255, 255, 0.12);
}

.nav-link::after {
  content: '';
  position: absolute;
  bottom: 2px;
  left: 50%;
  transform: translateX(-50%) scaleX(0);
  width: 60%;
  height: 2px;
  background: var(--color-primary-light);
  border-radius: 2px;
  transition: transform 0.3s ease;
}

.nav-link:hover::after,
.nav-link.active::after {
  transform: translateX(-50%) scaleX(1);
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.nav-user-info {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  color: rgba(255, 255, 255, 0.9);
  font-size: 0.9rem;
}

.nav-user-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--color-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  color: var(--color-white);
  font-size: 0.85rem;
}

/* Hamburger */
.nav-hamburger {
  display: none;
  flex-direction: column;
  gap: 5px;
  cursor: pointer;
  padding: 4px;
  z-index: 1001;
}

.nav-hamburger span {
  width: 24px;
  height: 2.5px;
  background: var(--color-white);
  border-radius: 2px;
  transition: var(--transition);
}

.nav-hamburger.active span:nth-child(1) {
  transform: rotate(45deg) translate(5px, 5px);
}

.nav-hamburger.active span:nth-child(2) {
  opacity: 0;
}

.nav-hamburger.active span:nth-child(3) {
  transform: rotate(-45deg) translate(5px, -5px);
}

/* --- Buttons --- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.55rem 1.35rem;
  border-radius: var(--radius-sm);
  border: none;
  font-family: var(--font-family);
  font-size: 0.9rem;
  font-weight: 500;
  cursor: pointer;
  transition: var(--transition);
  text-decoration: none;
  white-space: nowrap;
}

.btn-primary {
  background: var(--color-primary);
  color: var(--color-white);
  box-shadow: 0 2px 10px rgba(118, 139, 84, 0.3);
}

.btn-primary:hover {
  background: var(--color-primary-dark);
  transform: translateY(-1px);
  box-shadow: var(--shadow-glow);
}

.btn-secondary {
  background: transparent;
  color: var(--color-white);
  border: 1.5px solid rgba(255, 255, 255, 0.4);
}

.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.1);
  border-color: rgba(255, 255, 255, 0.7);
}

.btn-outline {
  background: transparent;
  color: var(--color-primary);
  border: 1.5px solid var(--color-primary);
}

.btn-outline:hover {
  background: var(--color-primary);
  color: var(--color-white);
}

.btn-danger {
  background: var(--color-error);
  color: var(--color-white);
}

.btn-danger:hover {
  background: #a93226;
}

.btn-sm {
  padding: 0.35rem 0.9rem;
  font-size: 0.82rem;
}

.btn-lg {
  padding: 0.75rem 2rem;
  font-size: 1rem;
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none !important;
}

/* --- Main Content --- */
.main-content {
  margin-top: 64px;
}

/* --- Hero / Carousel Section --- */
.carousel-section {
  position: relative;
  width: 100%;
  height: 600px;
  background: var(--color-bg);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem 0;
}

.carousel-container {
  position: relative;
  width: 100%;
  max-width: 1200px;
  height: 480px;
  perspective: 1200px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.carousel-slide {
  position: absolute;
  width: 550px;
  max-width: 80vw;
  height: 400px;
  opacity: 0;
  transform: translateX(0) scale(0.7) translateZ(-200px);
  transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 1;
  pointer-events: none;
  display: flex;
  align-items: center;
  justify-content: center;
}

.carousel-slide.active {
  opacity: 1;
  transform: translateX(0) scale(1) translateZ(0);
  z-index: 10;
  pointer-events: auto;
}

.carousel-slide.active img {
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85);
}

.carousel-slide.prev {
  opacity: 0.6;
  transform: translateX(-55%) scale(0.85) rotateY(15deg) translateZ(-100px);
  z-index: 5;
  cursor: pointer;
  pointer-events: auto;
}

.carousel-slide.next {
  opacity: 0.6;
  transform: translateX(55%) scale(0.85) rotateY(-15deg) translateZ(-100px);
  z-index: 5;
  cursor: pointer;
  pointer-events: auto;
}

.carousel-slide img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: var(--radius-lg);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
}

.btn-delete-photo {
  position: absolute;
  top: 12px;
  right: 12px;
  background: rgba(192, 57, 43, 0.85);
  color: white;
  border: none;
  border-radius: 50%;
  width: 38px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: var(--shadow-md);
  z-index: 30;
  opacity: 0;
  transform: scale(0.8);
  transition: all 0.3s ease;
  pointer-events: none;
}

.carousel-slide.active .btn-delete-photo {
  opacity: 1;
  transform: scale(1);
  pointer-events: auto;
}

.btn-delete-photo:hover {
  background: var(--color-error);
  transform: scale(1.1);
}

/* Carousel Controls */
.carousel-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: none;
  background: rgba(118, 139, 84, 0.15);
  backdrop-filter: blur(8px);
  color: var(--color-primary-dark);
  font-size: 1.4rem;
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 20;
}

.carousel-btn:hover {
  background: rgba(118, 139, 84, 0.25);
  transform: translateY(-50%) scale(1.08);
}

.carousel-btn-prev { left: 1.5rem; }
.carousel-btn-next { right: 1.5rem; }

.carousel-dots {
  position: absolute;
  bottom: 0.5rem;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  z-index: 20;
}

.carousel-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: rgba(118, 139, 84, 0.35);
  border: none;
  cursor: pointer;
  transition: var(--transition);
}

.carousel-dot.active {
  background: var(--color-primary-light);
  width: 28px;
  border-radius: 5px;
}

.carousel-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: rgba(26, 38, 34, 0.5);
  gap: 1rem;
}

.carousel-empty .material-icons {
  font-size: 4rem;
  opacity: 0.3;
}

.carousel-counter {
  position: absolute;
  top: 1rem;
  right: 1.5rem;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(6px);
  color: var(--color-white);
  padding: 0.3rem 0.8rem;
  border-radius: 20px;
  font-size: 0.8rem;
  z-index: 10;
}

/* --- Sections --- */
.section {
  padding: 4rem 2rem;
  max-width: 1200px;
  margin: 0 auto;
}

.section-header {
  text-align: center;
  margin-bottom: 3rem;
}

.section-header h2 {
  font-size: 1.85rem;
  font-weight: 600;
  color: var(--color-dark);
  margin-bottom: 0.5rem;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
}

.section-header p {
  color: rgba(26, 38, 34, 0.6);
  font-size: 1rem;
  max-width: 500px;
  margin: 0 auto;
}

.section-divider {
  width: 60px;
  height: 3px;
  background: linear-gradient(90deg, var(--color-primary), var(--color-primary-light));
  border-radius: 3px;
  margin: 0.75rem auto 0;
}

/* --- News Cards --- */
.news-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.75rem;
}

@media (max-width: 992px) {
  .news-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 600px) {
  .news-grid {
    grid-template-columns: 1fr;
  }
}

.news-card {
  background: var(--color-glass);
  backdrop-filter: blur(12px);
  border: 1px solid var(--color-glass-border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  transition: var(--transition);
  animation: fadeInUp 0.5s ease forwards;
  opacity: 0;
  padding: 1.25rem;
  display: flex;
  flex-direction: column;
  min-height: 550px;
  cursor: pointer;
}

.news-card:hover {
  transform: translateY(-6px);
  box-shadow: var(--shadow-lg);
}

.news-card-image {
  width: 100%;
  height: auto;
  max-height: 350px;
  object-fit: cover;
  border-radius: var(--radius-md);
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
}

/* --- News 3D Slider --- */
.news-card-3d-slider {
  position: relative;
  width: 100%;
  height: auto;
  aspect-ratio: 4 / 3;
  perspective: 1000px;
  overflow: hidden;
  border-radius: var(--radius-md);
  background: transparent;
}

.news-card-3d-slider .news-slide {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  opacity: 0;
  transform: rotateY(45deg) scale(0.9);
  transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  transform-style: preserve-3d;
  z-index: 0;
  border-radius: var(--radius-md);
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
}

.news-card-3d-slider .news-slide.active {
  opacity: 1;
  transform: rotateY(0) scale(1);
  z-index: 2;
}

.news-card-3d-slider .news-slide.prev {
  opacity: 0;
  transform: rotateY(-45deg) scale(0.9);
  z-index: 1;
}

.news-card-body {
  padding: 1.25rem 0 0 0;
  flex-grow: 1;
  display: flex;
  flex-direction: column;
}

/* Manage Photos Grid */
.manage-photos-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 15px;
  max-height: 60vh;
  overflow-y: auto;
  padding-right: 5px;
}

.manage-photo-item {
  position: relative;
  border-radius: var(--radius-md);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: var(--transition);
}

.manage-photo-item:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

.manage-photo-img {
  width: 100%;
  height: 150px;
  object-fit: cover;
  display: block;
  cursor: pointer;
  transition: transform 0.3s;
}

.manage-photo-img:hover {
  transform: scale(1.05);
}

.manage-photo-number {
  position: absolute;
  top: 5px;
  left: 5px;
  background: rgba(0, 0, 0, 0.6);
  color: white;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 0.75rem;
  font-weight: bold;
  z-index: 2;
}

.manage-photo-btn {
  position: absolute;
  top: 5px;
  right: 5px;
  background: var(--color-error);
  color: white;
  border: none;
  border-radius: 50%;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: transform 0.2s;
}

.manage-photo-btn:hover {
  transform: scale(1.1);
}

.manage-photo-info {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(0, 0, 0, 0.75);
  color: white;
  padding: 8px 5px;
  text-align: center;
  transition: all 0.3s ease;
  transform: translateY(100%);
}

.manage-photo-item:hover .manage-photo-info {
  transform: translateY(0);
}

.info-details {
  font-size: 0.65rem;
  opacity: 0.8;
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin-top: 2px;
}

.info-filename {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding: 0 4px;
}

.news-card-date {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  font-size: 0.78rem;
  color: var(--color-primary);
  font-weight: 500;
  margin-bottom: 0.5rem;
  background: rgba(118, 139, 84, 0.1);
  padding: 0.2rem 0.6rem;
  border-radius: 20px;
}

.news-card-title {
  font-size: 1.15rem;
  font-weight: 600;
  color: var(--color-dark);
  margin-bottom: 0.5rem;
  line-height: 1.4;
}

.news-card-content {
  font-size: 0.9rem;
  color: rgba(26, 38, 34, 0.7);
  line-height: 1.6;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.news-card-actions {
  padding: 0 1.5rem 1.25rem;
  display: flex;
  gap: 0.5rem;
}

.news-empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 3rem;
  color: rgba(26, 38, 34, 0.4);
}

.news-empty .material-icons {
  font-size: 3rem;
  margin-bottom: 0.5rem;
  opacity: 0.3;
}

/* --- Modals --- */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(26, 38, 34, 0.5);
  backdrop-filter: blur(4px);
  z-index: 2000;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s ease, visibility 0.3s ease;
  padding: 1rem;
}

.modal-backdrop.show {
  opacity: 1;
  visibility: visible;
}

.modal {
  background: var(--color-white);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  width: 100%;
  max-width: 480px;
  max-height: 90vh;
  overflow-y: auto;
  transform: translateY(20px) scale(0.97);
  transition: transform 0.3s ease;
}

.modal-backdrop.show .modal {
  transform: translateY(0) scale(1);
}

.modal-lg {
  max-width: 640px;
}

.modal-xl {
  width: 70vw;
  max-width: 1200px;
  max-height: 90vh;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.5rem 1.75rem 0;
}

.modal-header h3 {
  font-size: 1.25rem;
  font-weight: 600;
  color: var(--color-dark);
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.modal-close {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: var(--color-sage);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
  color: var(--color-dark);
  font-size: 1.1rem;
}

.modal-close:hover {
  background: var(--color-error);
  color: var(--color-white);
}

.modal-body {
  padding: 1.5rem 1.75rem;
}

.modal-footer {
  padding: 0 1.75rem 1.5rem;
  display: flex;
  gap: 0.75rem;
  justify-content: flex-end;
}

/* --- Form --- */
.form-group {
  margin-bottom: 1.25rem;
}

.form-label {
  display: block;
  font-size: 0.88rem;
  font-weight: 500;
  color: var(--color-dark);
  margin-bottom: 0.4rem;
}

.form-input,
.form-textarea {
  width: 100%;
  padding: 0.7rem 1rem;
  border: 1.5px solid var(--color-sage);
  border-radius: var(--radius-sm);
  font-family: var(--font-family);
  font-size: 0.95rem;
  color: var(--color-dark);
  background: var(--color-white);
  transition: var(--transition);
  outline: none;
}

.form-input:focus,
.form-textarea:focus {
  border-color: var(--color-primary);
  box-shadow: 0 0 0 3px rgba(118, 139, 84, 0.15);
}

.form-textarea {
  resize: vertical;
  min-height: 100px;
}

.form-error {
  color: var(--color-error);
  font-size: 0.82rem;
  margin-top: 0.5rem;
  display: flex;
  align-items: center;
  gap: 0.3rem;
}

/* --- Upload Zone --- */
.upload-zone {
  border: 2px dashed var(--color-sage);
  border-radius: var(--radius-md);
  padding: 2.5rem;
  text-align: center;
  cursor: pointer;
  transition: var(--transition);
  background: rgba(224, 229, 223, 0.2);
}

.upload-zone:hover,
.upload-zone.dragover {
  border-color: var(--color-primary);
  background: rgba(118, 139, 84, 0.06);
}

.upload-zone .material-icons {
  font-size: 3rem;
  color: var(--color-primary);
  margin-bottom: 0.5rem;
}

.upload-zone p {
  color: rgba(26, 38, 34, 0.6);
  font-size: 0.9rem;
}

.upload-zone p strong {
  color: var(--color-primary);
}

.upload-preview-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: 0.75rem;
  margin-top: 1rem;
}

.upload-preview-item {
  position: relative;
  border-radius: var(--radius-sm);
  overflow: hidden;
