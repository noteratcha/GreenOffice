<script>
// ============================================================
// Green Office - Client Side Logic
// ============================================================

// State
let currentUser = null;
let currentRole = null;
let uploadFiles = [];
let carouselImages = [];
let currentSlide = 0;
let carouselInterval = null;
let currentFeedbackLink = 'https://docs.google.com/forms/d/e/1FAIpQLSfqjLFZ2Lu6CDWFi1d8tnaIAVnGlO4zp229aMGtxqVSNDh4mg/formResponse';

// Initialize
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('currentYear').textContent = new Date().getFullYear();
  
  // Mobile Nav Toggle
  const hamburger = document.getElementById('navHamburger');
  const navCenter = document.getElementById('navCenter');
  hamburger.addEventListener('click', () => {
    hamburger.classList.toggle('active');
    navCenter.classList.toggle('open');
  });

  // Fix native anchor links inside iframe / Google Sites
  document.querySelectorAll('.nav-link').forEach(link => {
    link.addEventListener('click', function(e) {
      const targetId = this.getAttribute('href');
      if (targetId && targetId.startsWith('#')) {
        e.preventDefault();
        scrollToSection(targetId);
        document.querySelectorAll('.nav-link').forEach(nav => nav.classList.remove('active'));
        this.classList.add('active');
        
        // Close mobile menu if open
        hamburger.classList.remove('active');
        navCenter.classList.remove('open');
      }
    });
  });

  // Check saved session
  const savedUser = localStorage.getItem('go_user');
  const savedRole = localStorage.getItem('go_role');
  const savedName = localStorage.getItem('go_name');
  if (savedUser) {
    setUserSession(savedUser, savedRole, savedName || savedUser);
  }

  // Fetch initial data
  loadCategoryLinks();
  loadFeedbackLink();
  loadImages();
  loadNews();
  loadResourcesData();
  loadPolicyImages();
  initImageZoom();
  
  initCalendar();
  initFeedbackForm();

  // Drag & Drop for all upload zones
  setupDragAndDrop();
  setupPolicyDragAndDrop();
  setupNewsDragAndDrop();
  setupEditNewsDragAndDrop();

  // Safety fallback: ensure loading screen is hidden even if network is slow
  setTimeout(() => {
    const loader = document.getElementById('loadingScreen');
    if (loader && !loader.classList.contains('hidden')) {
      loader.classList.add('hidden');
    }
  }, 3000);

  // Close Photos FAB sub-menu when clicking outside
  document.addEventListener('click', (e) => {
    const group = document.getElementById('fabPhotosGroup');
    if (group && !group.contains(e.target)) {
      closePhotosSubMenu();
    }
  });
});

// ============================================================
// Authentication & FAB Group Controls
// ============================================================

function togglePhotosSubMenu() {
  const subMenu = document.getElementById('fabPhotosSubMenu');
  const parentBtn = document.getElementById('fabPhotosParent');
  if (subMenu && parentBtn) {
    const isOpen = subMenu.classList.toggle('open');
    parentBtn.classList.toggle('active', isOpen);
  }
}

function closePhotosSubMenu() {
  const subMenu = document.getElementById('fabPhotosSubMenu');
  const parentBtn = document.getElementById('fabPhotosParent');
  if (subMenu) subMenu.classList.remove('open');
  if (parentBtn) parentBtn.classList.remove('active');
}

function handleLogin(e) {
  e.preventDefault();
  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value.trim();
  const btn = document.getElementById('btnLoginSubmit');
  const errorMsg = document.getElementById('loginError');
  
  if(!user || !pass) return;
  
  btn.disabled = true;
  btn.innerHTML = 'กำลังเข้าสู่ระบบ...';
  errorMsg.classList.add('hidden');
  
  google.script.run
    .withSuccessHandler((res) => {
      btn.disabled = false;
      btn.innerHTML = 'เข้าสู่ระบบ';
      if (res.success) {
        setUserSession(res.user, res.role, res.name);
        closeModal('loginModal');
        showToast('เข้าสู่ระบบสำเร็จ', 'success');
        document.getElementById('loginForm').reset();
      } else {
        errorMsg.classList.remove('hidden');
        document.getElementById('loginErrorMsg').textContent = res.message;
      }
    })
    .withFailureHandler((err) => {
      btn.disabled = false;
      btn.innerHTML = 'เข้าสู่ระบบ';
      errorMsg.classList.remove('hidden');
      document.getElementById('loginErrorMsg').textContent = 'เชื่อมต่อล้มเหลว';
    })
    .checkLogin(user, pass);
}

function setUserSession(username, role, name = null) {
  currentUser = username;
  currentRole = role;
  const displayName = name || username;
  localStorage.setItem('go_user', username);
  if(role) localStorage.setItem('go_role', role);
  if(name) localStorage.setItem('go_name', name);
  
  document.getElementById('btnNavLogin').classList.add('hidden');
  document.getElementById('navUserInfo').classList.remove('hidden');
  document.getElementById('userNameDisplay').textContent = displayName;
  document.getElementById('userAvatarIcon').textContent = displayName.charAt(0).toUpperCase();
  
  document.getElementById('fabContainer').classList.remove('hidden');
  document.getElementById('fabAddNews').classList.remove('hidden');
  closePhotosSubMenu();
  
  if (role === 'admin' || username.toLowerCase() === 'admin') {
    document.getElementById('fabPolicy').classList.remove('hidden');
    document.getElementById('fabAddEvent').classList.remove('hidden');
    document.getElementById('fabPhotosParent').classList.remove('hidden');
    document.getElementById('fabEditCategories').classList.remove('hidden');
    document.getElementById('fabResources').classList.remove('hidden');
    document.getElementById('fabEditFeedback').classList.remove('hidden');
  } else {
    document.getElementById('fabPolicy').classList.add('hidden');
    document.getElementById('fabAddEvent').classList.add('hidden');
    document.getElementById('fabPhotosParent').classList.add('hidden');
    document.getElementById('fabEditCategories').classList.add('hidden');
    document.getElementById('fabResources').classList.add('hidden');
    document.getElementById('fabEditFeedback').classList.add('hidden');
  }
}

function logout() {
  currentUser = null;
  currentRole = null;
  localStorage.removeItem('go_user');
  localStorage.removeItem('go_role');
  localStorage.removeItem('go_name');
  
  document.getElementById('btnNavLogin').classList.remove('hidden');
  document.getElementById('navUserInfo').classList.add('hidden');
  document.getElementById('fabContainer').classList.add('hidden');
  closePhotosSubMenu();
  
  showToast('ออกจากระบบแล้ว', 'success');
}

// ============================================================
// Carousel & Images
// ============================================================

function loadImages() {
  google.script.run
    .withSuccessHandler((images) => {
      carouselImages = images;
      renderCarousel();
      
      // Hide loading screen after initial load
      setTimeout(() => {
        document.getElementById('loadingScreen').classList.add('hidden');
      }, 500);
    })
    .withFailureHandler((err) => {
      console.error(err);
      document.getElementById('carouselContainer').innerHTML = '<div class="carousel-empty">โหลดรูปภาพล้มเหลว</div>';
      document.getElementById('loadingScreen').classList.add('hidden');
    })
    .getImages();
}

function renderCarousel() {
  const container = document.getElementById('carouselContainer');
  const dotsContainer = document.getElementById('carouselDots');
  
  if (!carouselImages || carouselImages.length === 0) {
    container.innerHTML = '<div class="carousel-empty"><span class="material-icons">photo_library</span><p>ยังไม่มีรูปภาพกิจกรรม</p></div>';
    dotsContainer.innerHTML = '';
    return;
  }
  
  let html = '';
  let dotsHtml = '';
  
  carouselImages.forEach((img, index) => {
    const dateStr = new Date(img.date).toLocaleDateString('th-TH', { 
      year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
    });
    
    html += `
      <div class="carousel-slide" id="slide-${index}">
        <img src="${img.url}" alt="${img.name}" loading="lazy">
      </div>
    `;
    dotsHtml += `<button class="carousel-dot" onclick="goToSlide(${index})"></button>`;
  });
  
  container.innerHTML = html;
  
  // Show up to 10 dots max to prevent overflow
  if (carouselImages.length <= 15) {
    dotsContainer.innerHTML = dotsHtml;
  } else {
    dotsContainer.innerHTML = '';
  }
  
  goToSlide(0);
}

function goToSlide(index) {
  if (index < 0 || index >= carouselImages.length) return;
  currentSlide = index;
  
  const prevIdx = currentSlide === 0 ? carouselImages.length - 1 : currentSlide - 1;
  const nextIdx = currentSlide === carouselImages.length - 1 ? 0 : currentSlide + 1;
  
  document.querySelectorAll('.carousel-slide').forEach((slide, idx) => {
    slide.className = 'carousel-slide'; // reset
    slide.onclick = null;
    
    if (idx === currentSlide) {
      slide.classList.add('active');
      slide.style.cursor = 'zoom-in';
      slide.onclick = () => {
        const img = carouselImages[currentSlide];
        if (img) openPhotoPreview(img.url, currentSlide, img.id);
      };
    } else if (idx === prevIdx && carouselImages.length > 1) {
      slide.classList.add('prev');
      slide.style.cursor = 'pointer';
      slide.onclick = () => goToSlide(prevIdx);
    } else if (idx === nextIdx && carouselImages.length > 2) {
      slide.classList.add('next');
      slide.style.cursor = 'pointer';
      slide.onclick = () => goToSlide(nextIdx);
    } else if (idx === nextIdx && carouselImages.length === 2) {
      // If only 2 images, next and prev are the same
      slide.classList.add('next');
      slide.style.cursor = 'pointer';
      slide.onclick = () => goToSlide(nextIdx);
    }
  });

  document.querySelectorAll('.carousel-dot').forEach((dot, idx) => {
    if (idx === currentSlide) dot.classList.add('active');
    else dot.classList.remove('active');
  });
  
  // Reset timer
  startCarousel();
}

function nextSlide() {
  let next = currentSlide + 1;
  if (next >= carouselImages.length) next = 0;
  goToSlide(next);
}

function prevSlide() {
  let prev = currentSlide - 1;
  if (prev < 0) prev = carouselImages.length - 1;
  goToSlide(prev);
}

function updateCounter() {
  // Not used anymore
}

function startCarousel() {
  clearInterval(carouselInterval);
  if (carouselImages.length > 1) {
    carouselInterval = setInterval(nextSlide, 5000);
  }
}

function deletePhoto(fileId, event) {
  event.stopPropagation();
  
  const btn = event.currentTarget;
  btn.disabled = true;
  btn.innerHTML = '<span class="material-icons" style="font-size: 20px; animation: spin 1s linear infinite;">autorenew</span>';
  
  google.script.run
    .withSuccessHandler((res) => {
      if (res.success) {
        showToast('ลบรูปภาพสำเร็จ', 'success');
        // Remove from local array to update UI immediately
        carouselImages = carouselImages.filter(img => img.id !== fileId);
        renderManagePhotos(); // Update modal
        renderCarousel();     // Update carousel
      } else {
        showToast(res.message, 'error');
        btn.disabled = false;
        btn.innerHTML = '<span class="material-icons" style="font-size: 20px;">delete</span>';
      }
    })
    .withFailureHandler((err) => {
      showToast('การเชื่อมต่อล้มเหลว', 'error');
      btn.disabled = false;
      btn.innerHTML = '<span class="material-icons" style="font-size: 20px;">delete</span>';
    })
    .deleteImage(fileId);
}

let previewScale = 1;
let isPreviewDragging = false;
let previewStartX, previewStartY, previewTranslateX = 0, previewTranslateY = 0;

function openPhotoPreview(url, index, fileId) {
  if (!url) return;
  const fullUrl = url.replace('&sz=w600', '&sz=w1600').replace('&sz=w1200', '&sz=w1600');
  const img = document.getElementById('photoPreviewImg');
  img.src = fullUrl;
  
  // Reset zoom state
  previewScale = 1;
  previewTranslateX = 0;
  previewTranslateY = 0;
  img.style.transform = `translate(0px, 0px) scale(1)`;
  img.style.cursor = 'zoom-in';
  
  const numElem = document.getElementById('photoPreviewNumber');
  if (numElem) {
    if (typeof index === 'number' && index >= 0) {
      numElem.innerText = index + 1;
      numElem.style.display = 'block';
    } else {
      numElem.style.display = 'none';
    }
  }

  const delBtn = document.getElementById('photoPreviewDeleteBtn');
  if (delBtn) {
    if (fileId && currentRole === 'admin') {
      delBtn.style.display = 'flex';
      delBtn.onclick = (e) => {
        deletePhoto(fileId, e);
        closeModal('photoPreviewModal');
      };
    } else {
      delBtn.style.display = 'none';
    }
  }
  openModal('photoPreviewModal');
}

function initImageZoom() {
  const img = document.getElementById('photoPreviewImg');
  if (!img) return;

  img.style.transition = 'transform 0.2s ease-out';

  img.addEventListener('wheel', (e) => {
    e.preventDefault();
    const zoomAmount = 0.25;
    if (e.deltaY < 0) {
      previewScale += zoomAmount;
    } else {
      previewScale -= zoomAmount;
    }
    previewScale = Math.min(Math.max(0.5, previewScale), 5); // Limit 0.5x to 5x
    updatePreviewTransform();
  });

  img.addEventListener('mousedown', (e) => {
    if (previewScale > 1) {
      isPreviewDragging = true;
      previewStartX = e.clientX - previewTranslateX;
      previewStartY = e.clientY - previewTranslateY;
      img.style.cursor = 'grabbing';
      img.style.transition = 'none';
    } else {
      // Zoom in on click if not zoomed
      previewScale = 2;
      updatePreviewTransform();
    }
  });

  window.addEventListener('mousemove', (e) => {
    if (!isPreviewDragging) return;
    previewTranslateX = e.clientX - previewStartX;
    previewTranslateY = e.clientY - previewStartY;
    updatePreviewTransform();
  });

  window.addEventListener('mouseup', () => {
    if (isPreviewDragging) {
      isPreviewDragging = false;
      img.style.cursor = 'grab';
      img.style.transition = 'transform 0.2s ease-out';
    }
  });

  function updatePreviewTransform() {
    if (previewScale <= 1) {
      previewTranslateX = 0;
      previewTranslateY = 0;
    }
    img.style.transform = `translate(${previewTranslateX}px, ${previewTranslateY}px) scale(${previewScale})`;
    img.style.cursor = previewScale > 1 ? (isPreviewDragging ? 'grabbing' : 'grab') : 'zoom-in';
  }
}

function openManagePhotos() {
  renderManagePhotos();
  openModal('managePhotosModal');
}

function renderManagePhotos() {
  const container = document.getElementById('managePhotosGrid');
  if (!carouselImages || carouselImages.length === 0) {
    container.innerHTML = '<div class="news-empty">ไม่มีรูปภาพให้จัดการ</div>';
    return;
  }
  
  let html = '';
  carouselImages.forEach((img, index) => {
    const dateStr = new Date(img.date).toLocaleDateString('th-TH', { 
      year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
    });
    
    html += `
      <div class="manage-photo-item">
        <div class="manage-photo-number">${index + 1}</div>
        <img src="${img.url}" class="manage-photo-img" loading="lazy" onclick="openPhotoPreview('${img.url}', ${index}, '${img.id}')">
        <button class="manage-photo-btn" onclick="deletePhoto('${img.id}', event)" title="ลบรูปนี้">
          <span class="material-icons" style="font-size: 16px;">delete</span>
        </button>
        <div class="manage-photo-info">
          <div class="info-details">
            <div class="info-filename" title="${img.name}">${img.name}</div>
            <div class="info-date">${dateStr}</div>
          </div>
        </div>
      </div>
    `;
  });
  
  container.innerHTML = html;
}

// ============================================================
// Policy Management & Upload
// ============================================================

function selectPolicyType(type) {
  document.getElementById('policySelect').value = type;
  const opt1 = document.getElementById('optPolicy1');
  const opt2 = document.getElementById('optPolicy2');
  if (opt1) opt1.classList.toggle('active', type === '1');
  if (opt2) opt2.classList.toggle('active', type === '2');
}

let selectedPolicyFile = null;

function setupPolicyDragAndDrop() {
  const zone = document.getElementById('policyDropZone');
  if (!zone) return;
  
  zone.addEventListener('dragover', (e) => {
    e.preventDefault();
    zone.classList.add('dragover');
  });
  
  zone.addEventListener('dragleave', (e) => {
    e.preventDefault();
    zone.classList.remove('dragover');
  });
  
  zone.addEventListener('drop', (e) => {
    e.preventDefault();
    zone.classList.remove('dragover');
    if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
      processPolicyFile(e.dataTransfer.files[0]);
    }
  });
}

function handlePolicyFileSelect(e) {
  if (e.target.files && e.target.files.length > 0) {
    processPolicyFile(e.target.files[0]);
  }
}

function processPolicyFile(file) {
  if (!file.type.match('image.*')) {
    showToast('กรุณาเลือกไฟล์รูปภาพเท่านั้น', 'error');
    return;
  }
  if (file.size > 10 * 1024 * 1024) {
    showToast('ขนาดไฟล์ต้องไม่เกิน 10MB', 'error');
    return;
  }
  
  selectedPolicyFile = file;
  
  const reader = new FileReader();
  reader.onload = (e) => {
    document.getElementById('policyPreviewImg').src = e.target.result;
    document.getElementById('policyPreviewName').textContent = file.name;
    document.getElementById('policyPreviewSize').textContent = (file.size / (1024 * 1024)).toFixed(2) + ' MB';
    
    document.getElementById('policyDropZone').classList.add('hidden');
    document.getElementById('policyPreviewCard').classList.remove('hidden');
  };
  reader.readAsDataURL(file);
}

function removePolicyFile() {
  selectedPolicyFile = null;
  const fileInput = document.getElementById('policyFile');
  if (fileInput) fileInput.value = '';
  const previewCard = document.getElementById('policyPreviewCard');
  if (previewCard) previewCard.classList.add('hidden');
  const dropZone = document.getElementById('policyDropZone');
  if (dropZone) dropZone.classList.remove('hidden');
}

async function submitPolicy(e) {
  e.preventDefault();
  const policyNum = document.getElementById('policySelect').value;
  const btn = document.getElementById('btnPolicySubmit');
  const closeBtn = document.querySelector('#policyModal .modal-close');
  
  if (!selectedPolicyFile) {
    showToast('กรุณาเลือกรูปภาพนโยบาย', 'error');
    return;
  }

  btn.disabled = true;
  if (closeBtn) closeBtn.disabled = true;
  btn.innerHTML = '<span class="material-icons">hourglass_empty</span> กำลังบันทึก...';
  
  updateUploadProgress('policyProgressWrapper', 15, 'กำลังประมวลผลและปรับขนาดรูปภาพ (15%)...');
  
  try {
    const imagesData = await processFilesToBase64([selectedPolicyFile], 1600, 0.82);
    const fileData = imagesData[0];
    
    startServerProgressSimulation('policyProgressWrapper', 45, 92, 'กำลังอัปโหลดรูปภาพนโยบายขึ้น Google Drive...');
    
    google.script.run.withSuccessHandler(function(res) {
      btn.disabled = false;
      if (closeBtn) closeBtn.disabled = false;
      btn.innerHTML = '<span class="material-icons">cloud_upload</span> บันทึกรูปภาพ';
      
      if(res.success) {
        finishUploadProgress('policyProgressWrapper', 'อัปโหลดรูปภาพนโยบายสำเร็จเรียบร้อย! (100%)');
        setTimeout(() => {
          showToast('อัปโหลดรูปภาพนโยบายสำเร็จ', 'success');
          removePolicyFile();
          resetUploadProgress('policyProgressWrapper');
          closeModal('policyModal');
          
          const img = document.getElementById(`policyImg${policyNum}`);
          if (img) {
            img.onload = () => {
              img.classList.remove('hidden');
              document.getElementById(`policySkeleton${policyNum}`).classList.add('hidden');
            };
            img.onerror = () => {
              img.classList.add('hidden');
              document.getElementById(`policySkeleton${policyNum}`).classList.remove('hidden');
            };
            img.src = res.url;
          }
        }, 700);
      } else {
        resetUploadProgress('policyProgressWrapper');
        showToast('เกิดข้อผิดพลาด: ' + res.error, 'error');
      }
    }).withFailureHandler(function(err) {
      btn.disabled = false;
      if (closeBtn) closeBtn.disabled = false;
      btn.innerHTML = '<span class="material-icons">cloud_upload</span> บันทึกรูปภาพ';
      resetUploadProgress('policyProgressWrapper');
      showToast('เชื่อมต่อล้มเหลว: ' + (err.message || ''), 'error');
    }).savePolicyImage(policyNum, fileData.data, selectedPolicyFile.name, fileData.mimeType);
  } catch(err) {
    btn.disabled = false;
    if (closeBtn) closeBtn.disabled = false;
    btn.innerHTML = '<span class="material-icons">cloud_upload</span> บันทึกรูปภาพ';
    resetUploadProgress('policyProgressWrapper');
    showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
  }
}

// ============================================================
// File Upload & Base64 processing
// ============================================================

function setupDragAndDrop() {
  const zone = document.getElementById('uploadZone');
  
  zone.addEventListener('dragover', (e) => {
    e.preventDefault();
    zone.classList.add('dragover');
  });
  
  zone.addEventListener('dragleave', (e) => {
    e.preventDefault();
    zone.classList.remove('dragover');
  });
  
  zone.addEventListener('drop', (e) => {
    e.preventDefault();
    zone.classList.remove('dragover');
    if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
      processFiles(e.dataTransfer.files);
    }
  });
}

function handleFileSelect(e) {
  if (e.target.files && e.target.files.length > 0) {
    processFiles(e.target.files);
  }
}

function processFiles(files) {
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    if (!file.type.match('image.*')) {
      showToast('กรุณาเลือกไฟล์รูปภาพเท่านั้น', 'error');
      continue;
    }
    
    // File size limit (approx 5MB per file for base64 safety)
    if (file.size > 5 * 1024 * 1024) {
      showToast(`ไฟล์ ${file.name} มีขนาดใหญ่เกินไป (สูงสุด 5MB)`, 'error');
      continue;
    }

    const reader = new FileReader();
    reader.onload = (e) => {
      uploadFiles.push({
        file: file,
        dataUrl: e.target.result
      });
      renderUploadPreview();
    };
    reader.readAsDataURL(file);
  }
}

function renderUploadPreview() {
  const container = document.getElementById('uploadPreview');
  const btn = document.getElementById('btnUploadSubmit');
  const count = document.getElementById('uploadCount');
  
  if (uploadFiles.length === 0) {
    container.innerHTML = '';
    btn.disabled = true;
    count.textContent = '(0)';
    return;
  }
  
  let html = '';
  uploadFiles.forEach((item, index) => {
    html += `
      <div class="upload-preview-item">
        <img src="${item.dataUrl}">
        <button class="upload-preview-remove" onclick="removeUploadFile(${index})">

  pagedNews.forEach((news, idx) => {

    }
      
    const displayName = news.name || news.author || (news.user && news.user.toLowerCase() === 'admin' ? 'สำนักงานไปรษณีย์เขต 10' : news.user) || '';
    
    html += `
      <div class="news-card" style="animation-delay: ${idx * 0.1}s" onclick="openNewsDetail(${globalNewsData.indexOf(news)})">
        ${imgHtml}
        <div class="news-card-body">
          <h3 class="news-card-title">${news.title}</h3>
          <p class="news-card-content">${news.content}</p>
          <div class="news-card-footer">

              <span>${formatNewsDate(news.date)}${displayName ? ' โดย ' + displayName : ''}</span>
            </div>
          </div>
        </div>
      </div>
    `;
  });
  
  container.innerHTML = html;
  renderNewsPagination(totalPages);
  
  // Initialize 3D Slider animation: Sequential left to right with 3-second delay
  if (news3DSliderInterval) clearInterval(news3DSliderInterval);
  let currentSliderTurn = 0;

  news3DSliderInterval = setInterval(() => {
    const sliders = document.querySelectorAll('.news-card-3d-slider');
    if (sliders.length === 0) return;

    const currentSlider = sliders[currentSliderTurn % sliders.length];
    const slides = currentSlider.querySelectorAll('.news-slide');
    if (slides.length > 1) {
      let activeIdx = -1;
      slides.forEach((s, i) => { if (s.classList.contains('active')) activeIdx = i; });

      if (activeIdx !== -1) {
        slides[activeIdx].classList.remove('active');
        slides[activeIdx].classList.add('prev');
        slides.forEach((s, i) => {
          if (i !== activeIdx && s.classList.contains('prev')) s.classList.remove('prev');
        });
        let nextIdx = (activeIdx + 1) % slides.length;
        slides[nextIdx].classList.add('active');
      }
    }

    currentSliderTurn = (currentSliderTurn + 1) % sliders.length;
  }, 3000);
}

let activeProgressIntervals = {};

function updateUploadProgress(wrapperId, percent, statusText) {
  const prefix = wrapperId.replace('Wrapper', '');
  const wrapper = document.getElementById(wrapperId);
  const statusElem = document.getElementById(`${prefix}Status`);
  const percentElem = document.getElementById(`${prefix}Percent`);
  const barElem = document.getElementById(`${prefix}Bar`);

  if (wrapper) wrapper.classList.remove('hidden');
  if (statusElem && statusText) statusElem.textContent = statusText;
  
  const clamped = Math.min(100, Math.max(0, Math.round(percent)));
  if (percentElem) percentElem.textContent = `${clamped}%`;
  if (barElem) barElem.style.width = `${clamped}%`;
}

function startServerProgressSimulation(wrapperId, startPercent = 45, maxPercent = 90, statusText = 'กำลังส่งข้อมูลและบันทึกสู่ระบบ...') {
  if (activeProgressIntervals[wrapperId]) {
    clearInterval(activeProgressIntervals[wrapperId]);
  }
  
  let current = startPercent;
  updateUploadProgress(wrapperId, current, statusText);
  
  activeProgressIntervals[wrapperId] = setInterval(() => {
    if (current < maxPercent) {
      current += Math.random() * 4 + 2;
      if (current > maxPercent) current = maxPercent;
      updateUploadProgress(wrapperId, current, statusText);
    }
  }, 350);
}

function finishUploadProgress(wrapperId, successText = 'บันทึกข้อมูลสำเร็จเรียบร้อยแล้ว!') {
  if (activeProgressIntervals[wrapperId]) {
    clearInterval(activeProgressIntervals[wrapperId]);
    delete activeProgressIntervals[wrapperId];
  }
  updateUploadProgress(wrapperId, 100, successText);
}

function resetUploadProgress(wrapperId) {
  if (activeProgressIntervals[wrapperId]) {
    clearInterval(activeProgressIntervals[wrapperId]);
    delete activeProgressIntervals[wrapperId];
  }
  const wrapper = document.getElementById(wrapperId);
  if (wrapper) wrapper.classList.add('hidden');
  updateUploadProgress(wrapperId, 0, 'กำลังเตรียมข้อมูล...');
}

async function processFilesToBase64WithProgress(files, onProgress, maxDimension = 1280, quality = 0.75) {
  const results = [];
  const total = files.length;
  for (let i = 0; i < total; i++) {
    const file = files[i];
    if (onProgress) onProgress(i, total, file.name);
    const item = await new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let width = img.width;
          let height = img.height;
          if (width > maxDimension || height > maxDimension) {
            if (width > height) {
              height = Math.round((height * maxDimension) / width);
              width = maxDimension;
            } else {
              width = Math.round((width * maxDimension) / height);
              height = maxDimension;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL('image/jpeg', quality);
          resolve({
            data: dataUrl.split(',')[1],
            mimeType: 'image/jpeg'
          });
        };
        img.onerror = () => {
          resolve({
            data: e.target.result.split(',')[1],
            mimeType: file.type || 'image/jpeg'
          });
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
    results.push(item);
  }
  return results;
}

function processFilesToBase64(files, maxDimension = 1280, quality = 0.75) {
  return processFilesToBase64WithProgress(files, null, maxDimension, quality);
}

function formatNewsDate(dateVal) {
  if (!dateVal) return '';
  const thaiMonths = [
    'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
    'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'
  ];
  
  if (typeof dateVal === 'string') {
    const match = dateVal.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (match) {
      const day = parseInt(match[1]);
      const monthIdx = parseInt(match[2]) - 1;
      let year = parseInt(match[3]);
      if (year < 2500) year += 543;
      return `${day} ${thaiMonths[monthIdx] || match[2]} ${year}`;
    }
  }

  const d = new Date(dateVal);
  if (!isNaN(d.getTime())) {
    const day = d.getDate();
    const month = thaiMonths[d.getMonth()];
    let year = d.getFullYear();
    if (year < 2500) year += 543;
    return `${day} ${month} ${year}`;
  }

  return String(dateVal).split(' ')[0];
}

function scrollToSection(targetId) {
  const targetElement = document.querySelector(targetId);
  if (!targetElement) return;

  const navbar = document.querySelector('.navbar');
  const navHeight = navbar ? navbar.offsetHeight : 64;
  
  const rect = targetElement.getBoundingClientRect();
  const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
  const targetY = rect.top + scrollTop - navHeight;

  window.scrollTo({
    top: Math.max(0, targetY),
    behavior: 'smooth'
  });
}

function openModal(id) {
  document.getElementById(id).classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeModal(id) {
  document.getElementById(id).classList.remove('show');
  document.body.style.overflow = '';
  
  // Clear preview image when closing to prevent showing old image on next open
  if (id === 'photoPreviewModal') {
    setTimeout(() => {
      const img = document.getElementById('photoPreviewImg');
      if (img) img.src = '';
    }, 300); // Wait for fade out animation
  }

function showToast(message, type = 'success') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  
  const icon = type === 'success' ? 'check_circle' : 'error';
  const color = type === 'success' ? 'var(--color-success)' : 'var(--color-error)';
  
  toast.innerHTML = `
    <span class="material-icons" style="color: ${color}">${icon}</span>
    <span>${message}</span>
  `;
  
  container.appendChild(toast);
  
  setTimeout(() => {
    toast.classList.add('hide');
    setTimeout(() => {
      container.removeChild(toast);
    }, 300);
  }, 3000);
}

function initCalendar() {
  const calendarEl = document.getElementById('calendar');
  if (!calendarEl) return;
  
  if (typeof FullCalendar === 'undefined') {
    setTimeout(initCalendar, 500); // Wait for library to load
    return;
  }
  
  calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: 'dayGridMonth',
    locale: 'th',
    headerToolbar: {
      left: 'prev,next today',
      center: 'title',
      right: 'dayGridMonth,listMonth'
    },
    buttonText: {
      today: 'วันนี้',
      month: 'เดือน',
      list: 'กำหนดการ'
    },
    height: 'auto',
    dayMaxEvents: 3,
    eventContent: function(arg) {
      const color = arg.event.backgroundColor || '#4a6344';
      let timeStr = '';
      if (!arg.event.allDay && arg.event.start) {
        timeStr = arg.event.start.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
      }
      
      return {
        html: `
          <div class="custom-cal-event" style="--event-color: ${color};">
            <span class="custom-event-dot" style="background: ${color};"></span>
            ${timeStr ? `<span class="custom-event-time">${timeStr}</span>` : ''}
            <span class="custom-event-title">${arg.event.title}</span>
          </div>
        `
      };
    },
    events: function(info, successCallback, failureCallback) {
      google.script.run.withSuccessHandler(function(events) {
        successCallback(events);
      }).withFailureHandler(function(error) {
        console.error('Failed to load events', error);
        failureCallback(error);
      }).getCalendarEvents();
    },
    eventClick: function(info) {
      document.getElementById('eventDetailTitle').textContent = info.event.title;
      
      let timeText = 'ตลอดวัน';
      if (!info.event.allDay && info.event.start) {
        const dateOpts = { year: 'numeric', month: 'long', day: 'numeric' };
        const timeOpts = { hour: '2-digit', minute: '2-digit' };
        timeText = info.event.start.toLocaleDateString('th-TH', dateOpts) + ' เวลา ' + info.event.start.toLocaleTimeString('th-TH', timeOpts) + ' น.';
      } else if (info.event.start) {
        const dateOpts = { year: 'numeric', month: 'long', day: 'numeric' };
        timeText = info.event.start.toLocaleDateString('th-TH', dateOpts) + ' (ตลอดวัน)';
      }
      document.getElementById('eventDetailTimeText').textContent = timeText;
      
      const iconWrap = document.getElementById('eventDetailIcon');
      if (info.event.backgroundColor) {
        iconWrap.style.backgroundColor = info.event.backgroundColor + '20';
        iconWrap.style.color = info.event.backgroundColor;
      } else {
        iconWrap.style.backgroundColor = 'var(--color-light)';
        iconWrap.style.color = 'var(--color-primary)';
      }
      
      document.getElementById('btnDeleteEvent').dataset.eventId = info.event.id;
      
      const user = info.event.extendedProps.user;
      if (currentRole === 'admin' || (currentUser && currentUser === user)) {
        document.getElementById('btnDeleteEvent').classList.remove('hidden');
        document.getElementById('btnEditEventAction').classList.remove('hidden');
        
        // Prepare data for Edit modal
        document.getElementById('btnEditEventAction').dataset.eventId = info.event.id;
        document.getElementById('btnEditEventAction').dataset.eventTitle = info.event.title;
        
        let startDate = '';
        let startTime = '';
        if (info.event.start) {
          const startStr = info.event.start;
          const tzoffset = (new Date()).getTimezoneOffset() * 60000; // offset in milliseconds
          const localISOTime = (new Date(startStr - tzoffset)).toISOString().slice(0, -1);
          startDate = localISOTime.split('T')[0];
          if (!info.event.allDay) {
            startTime = localISOTime.split('T')[1].substring(0, 5);
          }
        }
        document.getElementById('btnEditEventAction').dataset.eventDate = startDate;
        document.getElementById('btnEditEventAction').dataset.eventTime = startTime;
        document.getElementById('btnEditEventAction').dataset.eventColor = info.event.backgroundColor || '#27ae60';
        
      } else {
        document.getElementById('btnDeleteEvent').classList.add('hidden');
        document.getElementById('btnEditEventAction').classList.add('hidden');
      }
      
      openModal('eventDetailModal');
    },
    eventDidMount: function(info) {
      let tooltipText = info.event.title;
      if (!info.event.allDay && info.event.start) {
        const timeOpts = { hour: '2-digit', minute: '2-digit' };
        tooltipText += '\nเวลา: ' + info.event.start.toLocaleTimeString('th-TH', timeOpts) + ' น.';
      } else {
        tooltipText += '\nเวลา: ตลอดวัน';
      }
      info.el.setAttribute('title', tooltipText);
    }
  });
  
  calendar.render();
}

function getAllAvailableYears() {
  const yearSet = new Set();
  if (resourceData) {
    Object.keys(resourceData).forEach(key => {
      if (Array.isArray(resourceData[key])) {
        resourceData[key].forEach(item => {
          if (item && item.year) {
            yearSet.add(String(item.year).trim());
          }
        });
      }
    });
  }
  return Array.from(yearSet).sort((a, b) => {
    const numA = parseInt(a, 10);
    const numB = parseInt(b, 10);
    if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
    return a.localeCompare(b);
  });
}

function populateModalYearSelectors(metricKey) {
  const rawItems = (resourceData && resourceData[metricKey]) ? resourceData[metricKey] : [];
  const years = [...rawItems].map(item => String(item.year).trim()).sort((a, b) => {
    const numA = parseInt(a, 10);
    const numB = parseInt(b, 10);
    if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
    return a.localeCompare(b);
  });
  
  const filterBar = document.querySelector('.modal-year-filter-bar');
  if (!filterBar) return;
  
  if (years.length < 2) {
    filterBar.style.display = 'none';
    if (years.length === 1) {
      selectedTargetYear = years[0];
      selectedBaseYear = years[0];
    }
    return;
  }
  
  filterBar.style.display = 'flex';
  
  // 1. Ensure Target Year (ปีเปรียบเทียบ) is valid
  if (!selectedTargetYear || !years.includes(selectedTargetYear)) {
    selectedTargetYear = years[years.length - 1]; // Latest year (e.g. 2569)
  }
  
  // 2. Base year MUST be strictly less than Target year (< selectedTargetYear)
  const availableBaseYears = years.filter(y => {
    const numY = parseInt(y, 10);
    const numTarget = parseInt(selectedTargetYear, 10);
    if (!isNaN(numY) && !isNaN(numTarget)) return numY < numTarget;
    return String(y).localeCompare(String(selectedTargetYear)) < 0;
  });
  
  if (!selectedBaseYear || !availableBaseYears.includes(selectedBaseYear)) {
    selectedBaseYear = availableBaseYears.length > 0 ? availableBaseYears[availableBaseYears.length - 1] : years[0];
  }
  
  const availableTargetYears = years.slice(1);
  
  const modalTarget = document.getElementById('modalSelectTargetYear');
  if (modalTarget) {
    modalTarget.innerHTML = '';
    availableTargetYears.forEach(y => {
      const opt = document.createElement('option');
      opt.value = y;
      opt.textContent = 'ปี ' + y;
      if (y === selectedTargetYear) opt.selected = true;
      modalTarget.appendChild(opt);
    });
    modalTarget.value = selectedTargetYear;
  }
  
  const modalBase = document.getElementById('modalSelectBaseYear');
  if (modalBase) {
    modalBase.innerHTML = '';
    const baseList = availableBaseYears.length > 0 ? availableBaseYears : [years[0]];
    baseList.forEach(y => {
      const opt = document.createElement('option');
      opt.value = y;
      opt.textContent = 'ปี ' + y;
      if (y === selectedBaseYear) opt.selected = true;
      modalBase.appendChild(opt);
    });
    modalBase.value = selectedBaseYear;
  }
}

function onModalYearChange(changedField) {
  const modalBase = document.getElementById('modalSelectBaseYear');
  const modalTarget = document.getElementById('modalSelectTargetYear');
  
  const newBase = modalBase ? modalBase.value : selectedBaseYear;
  const newTarget = modalTarget ? modalTarget.value : selectedTargetYear;
  
  const numBase = parseInt(newBase, 10);
  const numTarget = parseInt(newTarget, 10);
  
  const rawItems = (resourceData && resourceData[currentMonthlyModalMetric]) ? resourceData[currentMonthlyModalMetric] : [];
  const years = [...rawItems].map(item => String(item.year).trim()).sort((a, b) => {
    const numA = parseInt(a, 10);
    const numB = parseInt(b, 10);
    if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
    return a.localeCompare(b);
  });
  
  if (changedField === 'target') {
    selectedTargetYear = newTarget;
    if (numBase >= numTarget) {
      const validBases = years.filter(y => parseInt(y, 10) < numTarget);
      selectedBaseYear = validBases.length > 0 ? validBases[validBases.length - 1] : years[0];
    } else {
      selectedBaseYear = newBase;
    }
  } else {
    selectedBaseYear = newBase;
    if (numBase >= numTarget) {
      const validTargets = years.filter(y => parseInt(y, 10) > numBase);
      selectedTargetYear = validTargets.length > 0 ? validTargets[0] : years[years.length - 1];
    } else {
      selectedTargetYear = newTarget;
    }
  }
  
  populateModalYearSelectors(currentMonthlyModalMetric);
  renderMonthlyModalContent(currentMonthlyModalMetric);
}

function calculateSamePeriodComparison(prevItem, currItem, metricKey) {
  if (!prevItem || !currItem) return null;
  
  const prevMonths = prevItem.months || [];
  const currMonths = currItem.months || [];
  
  let sumPrev = 0;
  let sumCurr = 0;
  let recordedMonthsIndices = [];
  
  for (let m = 0; m < 12; m++) {
    const currVal = parseFloat(currMonths[m]) || 0;
    const prevVal = parseFloat(prevMonths[m]) || 0;
    
    // If current year has recorded data in month m (> 0)
    if (currVal > 0) {
      sumCurr += currVal;
      sumPrev += prevVal;
      recordedMonthsIndices.push(m);
    }
  }
  
  // If current year has no data yet, fallback to comparing all 12 months
  if (recordedMonthsIndices.length === 0) {
    for (let m = 0; m < 12; m++) {
      sumCurr += (parseFloat(currMonths[m]) || 0);
      sumPrev += (parseFloat(prevMonths[m]) || 0);
      recordedMonthsIndices.push(m);
    }
  }
  
  let percentDiff = 0;
  if (sumPrev > 0) {
    percentDiff = ((sumCurr - sumPrev) / sumPrev) * 100;
  }
  
  return {
    prevYear: prevItem.year,
    currYear: currItem.year,
    sumPrev: sumPrev,
    sumCurr: sumCurr,
    percentDiff: percentDiff,
    recordedMonthsIndices: recordedMonthsIndices
  };
}

              formatter: (value) => Number(value).toLocaleString()
            }
          });
        } else {
          // Standard unstacked if all 12 months are recorded
          datasets = [
            {
              label: 'ปี ' + itemBase.year,
              data: [itemBase.total],
              backgroundColor: 'rgba(93, 173, 226, 0.92)',
              borderColor: 'rgba(41, 128, 185, 1)',
              borderWidth: 1.5,
              borderRadius: 6,
              barPercentage: 0.64,
              categoryPercentage: 0.85,
              stack: 'stackBase',
              datalabels: {
                color: '#0f172a',

            borderWidth: 1.5,
            borderRadius: 6,
            barPercentage: 0.64,
            categoryPercentage: 0.85,

              font: { weight: 'bold', size: 12.5, family: "'Kanit', sans-serif" },
              formatter: (value) => Number(value).toLocaleString()
            }
          }
        ];
      }
      
      // Helper function to draw smooth rounded pill badge on canvas
      function drawPillBadge(ctx, x, y, w, h, r, bg, border, textColor, text) {
        ctx.save();
        ctx.beginPath();
        const left = x - w / 2;
        const top = y;
        ctx.moveTo(left + r, top);
        ctx.lineTo(left + w - r, top);
        ctx.quadraticCurveTo(left + w, top, left + w, top + r);
        ctx.lineTo(left + w, top + h - r);
        ctx.quadraticCurveTo(left + w, top + h, left + w - r, top + h);
        ctx.lineTo(left + r, top + h);
        ctx.quadraticCurveTo(left, top + h, left, top + h - r);
        ctx.lineTo(left, top + r);
        ctx.quadraticCurveTo(left, top, left + r, top);
        ctx.closePath();
        ctx.fillStyle = bg;
        ctx.fill();
        if (border) {
          ctx.strokeStyle = border;
          ctx.lineWidth = 1;
          ctx.stroke();
        }
        ctx.font = "bold 11.5px 'Kanit', sans-serif";
        ctx.fillStyle = textColor;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, x, top + (h / 2) + 0.5);
        ctx.restore();
      }

      // Custom Plugin: draws bottom Year Pill Badges and uncalculated Callout Chip
      const overviewUxPlugin = {
        id: 'overviewUxPlugin',
        afterDatasetsDraw(chart) {
          try {
            const ctx = chart.ctx;
            const meta0 = chart.getDatasetMeta(0);
            const metaTarget = chart.getDatasetMeta(hasUncalculated ? 2 : 1);
            const yBottom = chart.scales.y.bottom;

            // 1. Draw sleek Year Pill Badges under each bar
            if (meta0 && meta0.data && meta0.data[0]) {
              const b0 = meta0.data[0];
              drawPillBadge(ctx, b0.x, yBottom + 7, 72, 22, 11, 'rgba(235, 245, 251, 0.95)', '#aed6f1', '#1b4f72', 'ปี ' + itemBase.year);
            }

            if (dataToShow.length > 1 && metaTarget && metaTarget.data && metaTarget.data[0]) {
              const bT = metaTarget.data[0];
              drawPillBadge(ctx, bT.x, yBottom + 7, 72, 22, 11, 'rgba(232, 248, 245, 0.95)', '#a3e4d7', '#0e6251', 'ปี ' + itemTarget.year);
            }

            // 2. Yellow Segment value & Callout Chip for thin slice
            if (hasUncalculated && uncalculatedPrev > 0) {
              const meta1 = chart.getDatasetMeta(1);
              if (meta1 && meta1.data && meta1.data[0] && meta0 && meta0.data && meta0.data[0]) {
                const barBlue = meta0.data[0];
                const barYellow = meta1.data[0];
                const segH = Math.abs(barBlue.y - barYellow.y);
                const uncalcText = Number(uncalculatedPrev).toLocaleString();

                if (segH >= 20) {
                  // Inside Yellow segment
                  ctx.save();
                  ctx.font = "bold 11px 'Kanit', sans-serif";
                  ctx.fillStyle = '#78350f';
                  ctx.textAlign = 'center';
                  ctx.textBaseline = 'middle';
                  ctx.fillText(uncalcText, barYellow.x, (barYellow.y + barBlue.y) / 2);
                  ctx.restore();
                } else {
                  // Thin slice (< 20px) -> Draw Callout Chip pointing to gap
                  const xStart = barYellow.x + (barYellow.width / 2);
                  const yMid = (barYellow.y + barBlue.y) / 2;
                  const xBend = xStart + 8;
                  const yBend = yMid - 7;
                  const xEnd = xStart + 16;

                  ctx.save();
                  // Gold dot on slice edge
                  ctx.beginPath();
                  ctx.arc(xStart, yMid, 2.5, 0, 2 * Math.PI);
                  ctx.fillStyle = '#d4ac0d';
                  ctx.fill();

                  // Golden pointer line
                  ctx.beginPath();
                  ctx.moveTo(xStart, yMid);
                  ctx.lineTo(xBend, yBend);
                  ctx.lineTo(xEnd, yBend);
                  ctx.strokeStyle = '#d4ac0d';
                  ctx.lineWidth = 1.2;
                  ctx.stroke();

                  // Floating Callout Badge Chip
                  drawPillBadge(ctx, xEnd + 22, yBend - 9, 44, 18, 9, '#fef9e7', '#f9e79f', '#7d6608', uncalcText);
                  ctx.restore();
                }
              }
            }
          } catch (e) {
            console.warn('overviewUxPlugin error:', e);
          }
        }
      };

      // Calculate max value to set Y-axis max +30%
      const maxVal = Math.max(parseFloat(itemBase.total) || 0, parseFloat(itemTarget.total) || 0);
      const overviewYMax = maxVal > 0 ? (maxVal * 1.30) : undefined;

      resourcesChartInstances[config.id] = new Chart(ctx, {
        type: 'bar',
        plugins: [overviewUxPlugin],
        data: {
          labels: [''],
          datasets: datasets
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: {
            padding: { top: 28, bottom: 32, left: 10, right: 10 }
          },
          plugins: {
            legend: {
              display: false
            },
            tooltip: {
              backgroundColor: 'rgba(15, 23, 42, 0.94)',
              titleFont: { size: 12.5, family: "'Kanit', sans-serif", weight: 'bold' },
              bodyFont: { size: 12, family: "'Kanit', sans-serif" },
              padding: 12,
              cornerRadius: 10,
              displayColors: false,
              callbacks: {
                title: () => config.label,
                label: function(context) {
                  if (context.raw === null || context.raw === undefined || context.raw === 0) return '';
                  if (context.dataset.isCalculatedSegment) {
                    return `🟦 ปี ${itemBase.year} (ช่วงเทียบ ${rangeStr}): ${Number(context.raw).toLocaleString()}`;
                  }
                  if (context.dataset.isUncalculatedSegment) {
                    return `🟨 ปี ${itemBase.year} (ไม่ได้นำมาคำนวณ): ${Number(context.raw).toLocaleString()}`;
                  }
                  return `🟩 ${context.dataset.label}: ${Number(context.raw).toLocaleString()}`;
                },
                afterBody: function(items) {
                  if (hasUncalculated && items.length > 0) {
                    const isBase = items.some(it => it.datasetIndex === 0 || it.datasetIndex === 1);
                    if (isBase) {
                      const uncalcStr = Number(uncalculatedPrev).toLocaleString();
                      const totalStr = Number(itemBase.total).toLocaleString();
                      let lines = [];
                      if (uncalculatedPrev > 0) {
                        const isAlreadyShowingUncalc = items.some(it => it.datasetIndex === 1);
                        if (!isAlreadyShowingUncalc) {
                          lines.push(`🟨 ปี ${itemBase.year} (ไม่ได้นำมาคำนวณ): ${uncalcStr}`);
                        }
                      }
                      lines.push(`--------------------`);
                      lines.push(`📋 รวมทั้งปี ${itemBase.year}: ${totalStr}`);
                      return lines.join('\n');
                    }
                  }
                  return '';
                }
              }
            },
            datalabels: {
              display: true
            }
          },
          scales: {
            x: {
              stacked: true,
              display: false
            },
            y: {
              stacked: true,
              beginAtZero: true,
              max: overviewYMax,
              suggestedMax: overviewYMax,
              grid: {
                color: 'rgba(0, 0, 0, 0.05)',
                drawBorder: false
              },
              ticks: {
                font: { size: 10.5, family: "'Kanit', sans-serif" },
                color: '#64748b',
                callback: (val) => Number(val).toLocaleString()
              }
            }
          }
        }
      });
    } catch (err) {
      console.error('Error rendering chart for ' + config.id, err);
    }
  });
}

    iconBadgeEl.innerHTML = `<span class="material-icons">${metricCfg.icon}</span>`;
  }
  
  const rawItems = (resourceData && resourceData[metricKey]) ? resourceData[metricKey] : [];
  
  // Find base and target items
  const itemBase = rawItems.find(r => String(r.year) === String(selectedBaseYear));
  const itemTarget = rawItems.find(r => String(r.year) === String(selectedTargetYear));
  
  let prevItem = itemBase;
  let currItem = itemTarget;
  
  // Fallback if not found
  if (!currItem && rawItems.length > 0) currItem = rawItems[rawItems.length - 1];
  if (!prevItem && rawItems.length > 1) prevItem = rawItems[rawItems.length - 2];

  if (!currItem) currItem = { year: '-', months: Array(12).fill(0), total: 0 };
  
  const isSingleYear = String(prevItem.year) === String(currItem.year);
  
  // Line datasets for other historical/additional years (e.g. 2566, 2567)
  const otherItems = (!isSingleYear) ? rawItems.filter(r => 
    String(r.year) !== String(prevItem.year) && 
    String(r.year) !== String(currItem.year)
  ).sort((a, b) => (parseInt(a.year, 10) || 0) - (parseInt(b.year, 10) || 0)) : [];

  const OTHER_YEAR_LINE_PALETTES = [
    { border: '#8b5cf6', bg: 'rgba(139, 92, 246, 0.08)', point: '#7c3aed' }, // Purple
    { border: '#f97316', bg: 'rgba(249, 115, 22, 0.08)', point: '#ea580c' }, // Orange
    { border: '#06b6d4', bg: 'rgba(6, 182, 212, 0.08)', point: '#0891b2' },  // Cyan
    { border: '#ec4899', bg: 'rgba(236, 72, 153, 0.08)', point: '#db2777' }, // Pink
    { border: '#6366f1', bg: 'rgba(99, 102, 241, 0.08)', point: '#4f46e5' }, // Indigo
    { border: '#14b8a6', bg: 'rgba(20, 184, 166, 0.08)', point: '#0d9488' }  // Teal
  ];

  if (modalTitle) {
    modalTitle.textContent = `สถิติเปรียบเทียบรายเดือน: ${metricName}`;
  }
  if (modalSubtitle) {
    if (isSingleYear) {
      modalSubtitle.textContent = `ข้อมูลรายเดือน (ม.ค. - ธ.ค.) ของ${metricCfg.label} ปี ${currItem.year}`;
    } else {
      modalSubtitle.textContent = `เปรียบเทียบข้อมูลรายเดือน (ม.ค. - ธ.ค.) ระหว่างปี ${prevItem.year} และปี ${currItem.year}`;
    }
  }
  
  const comp = isSingleYear ? null : calculateSamePeriodComparison(prevItem, currItem, metricKey);
  
  // Update Table Headers
  const thPrev = document.getElementById('thPrevYear');
  const thCurr = document.getElementById('thCurrYear');
  if (thPrev) thPrev.textContent = `ปี ${prevItem.year}`;
  if (thCurr) thCurr.textContent = `ปี ${currItem.year}`;
  
  // Render Stat Pills
  const statPillsEl = document.getElementById('monthlyModalStatPills');
  if (statPillsEl) {
    const p = comp ? comp.percentDiff : 0;
    const isIncrease = p > 0;
    const isDecrease = p < 0;
    let isGood = isDecrease;
    if (metricKey === 'recycledWaste') {
      isGood = isIncrease;
    }
    const pFormatted = Math.abs(p).toFixed(2) + '%';
    
    let periodText = '';
    if (comp && comp.recordedMonthsIndices.length < 12 && comp.recordedMonthsIndices.length > 0) {
      const firstM = MONTH_SHORT_LABELS[comp.recordedMonthsIndices[0]];
      const lastM = MONTH_SHORT_LABELS[comp.recordedMonthsIndices[comp.recordedMonthsIndices.length - 1]];
      periodText = `<span style="font-size: 0.75rem; color: var(--color-text-light); font-weight: normal;">(ช่วง ${firstM} - ${lastM})</span>`;

      statPillsEl.innerHTML = `
        <div style="background: #e8f8f5; border: 1px solid #d1f2eb; border-radius: var(--radius-md); padding: 0.85rem 1.15rem; text-align: center;">
          <div style="font-size: 0.8rem; color: #117864; font-weight: 500; margin-bottom: 0.2rem;">ยอดรวมปี ${currItem.year}</div>
          <div style="font-size: 1.35rem; color: #0e6251; font-weight: 700;">${Number(currItem.total).toLocaleString()}</div>
        </div>
      `;
    } else {
      let diffCardHtml = '';
      if (isGood && (isIncrease || isDecrease)) {
        // ผลเชิงบวก (ประหยัดขึ้น หรือ นำของเสียกลับมาใช้มากขึ้น) -> สีเขียว
        diffCardHtml = `
          <div style="background: #eafaf1; border: 1px solid #abebc6; border-radius: var(--radius-md); padding: 0.85rem 1.15rem; text-align: center;">
            <div style="font-size: 0.8rem; color: #1e8449; font-weight: 500; margin-bottom: 0.2rem;">ผลต่างเทียบช่วงเดียวกัน</div>
            <div style="font-size: 1.35rem; color: #196f3d; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 0.3rem;">
              <span class="material-icons" style="font-size: 1.3rem;">${isIncrease ? 'trending_up' : 'trending_down'}</span>
              ${isIncrease ? 'เพิ่มขึ้น' : 'ลดลง'} ${pFormatted}
            </div>
          </div>
        `;
      } else if (!isGood && (isIncrease || isDecrease)) {
        // ผลเชิงลบ (ใช้จ่ายมากขึ้น หรือ นำของเสียกลับมาใช้น้อยลง) -> สีแดงส้ม
        diffCardHtml = `
          <div style="background: #fef5f1; border: 1px solid #fadbd8; border-radius: var(--radius-md); padding: 0.85rem 1.15rem; text-align: center;">
            <div style="font-size: 0.8rem; color: #c0392b; font-weight: 500; margin-bottom: 0.2rem;">ผลต่างเทียบช่วงเดียวกัน</div>
            <div style="font-size: 1.35rem; color: #a93226; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 0.3rem;">
              <span class="material-icons" style="font-size: 1.3rem;">${isIncrease ? 'trending_up' : 'trending_down'}</span>
              ${isIncrease ? 'เพิ่มขึ้น' : 'ลดลง'} ${pFormatted}
            </div>
          </div>
        `;
      } else {
        diffCardHtml = `
          <div style="background: #f4f6f6; border: 1px solid #d5dbdb; border-radius: var(--radius-md); padding: 0.85rem 1.15rem; text-align: center;">
            <div style="font-size: 0.8rem; color: #566573; font-weight: 500; margin-bottom: 0.2rem;">ผลต่างเทียบช่วงเดียวกัน</div>
            <div style="font-size: 1.35rem; color: #2c3e50; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 0.3rem;">
              0.00%
            </div>
          </div>
        `;
      }

      const hasUncalculatedPrev = comp && (parseFloat(prevItem.total) > parseFloat(comp.sumPrev));
      const prevValDisplay = hasUncalculatedPrev 
        ? `${Number(comp.sumPrev).toLocaleString()} <span style="font-size: 0.95rem; color: #5d6d7e; font-weight: 500;">/ ${Number(prevItem.total).toLocaleString()}</span>`
        : Number(comp ? comp.sumPrev : prevItem.total).toLocaleString();

      const hasUncalculatedCurr = comp && (parseFloat(currItem.total) > parseFloat(comp.sumCurr));
      const currValDisplay = hasUncalculatedCurr 
        ? `${Number(comp.sumCurr).toLocaleString()} <span style="font-size: 0.95rem; color: #5d6d7e; font-weight: 500;">/ ${Number(currItem.total).toLocaleString()}</span>`
        : Number(comp ? comp.sumCurr : currItem.total).toLocaleString();

      statPillsEl.innerHTML = `
        <div style="background: #ebf5fb; border: 1px solid #d4e6f1; border-radius: var(--radius-md); padding: 0.85rem 1.15rem; text-align: center;" title="ค่าที่นำมาคำนวณ: ${Number(comp ? comp.sumPrev : prevItem.total).toLocaleString()} | ยอดรวมทั้งปี: ${Number(prevItem.total).toLocaleString()}">
          <div style="font-size: 0.8rem; color: #2874a6; font-weight: 500; margin-bottom: 0.2rem;">ปี ${prevItem.year} ${periodText} ${hasUncalculatedPrev ? '<span style="font-size: 0.72rem; color: #7f8c8d;">(ช่วงเทียบ / ทั้งปี)</span>' : ''}</div>
          <div style="font-size: 1.35rem; color: #1b4f72; font-weight: 700;">${prevValDisplay}</div>
        </div>
        <div style="background: #e8f8f5; border: 1px solid #d1f2eb; border-radius: var(--radius-md); padding: 0.85rem 1.15rem; text-align: center;" title="ค่าที่นำมาคำนวณ: ${Number(comp ? comp.sumCurr : currItem.total).toLocaleString()} | ยอดรวมทั้งปี: ${Number(currItem.total).toLocaleString()}">
          <div style="font-size: 0.8rem; color: #117864; font-weight: 500; margin-bottom: 0.2rem;">ปี ${currItem.year} ${periodText}</div>
          <div style="font-size: 1.35rem; color: #0e6251; font-weight: 700;">${currValDisplay}</div>
        </div>
        ${diffCardHtml}
      `;
    }
  }
  
  // Render Overlapping 30% Bar Chart
  const canvas = document.getElementById('monthlyDetailCanvas');
  if (canvas) {
    const ctx = canvas.getContext('2d');
    if (monthlyDetailChartInstance) {
      monthlyDetailChartInstance.destroy();
    }
    
    const datasets = [];

    if (!isSingleYear) {
      // Determine colors for Base Year: calculated months = blue, uncalculated months = yellow/amber
      const prevBarBgColors = [];
      const prevBarBorderColors = [];
      if (prevItem && Array.isArray(prevItem.months)) {
        for (let m = 0; m < 12; m++) {
          const isIncluded = comp ? comp.recordedMonthsIndices.includes(m) : true;
          if (isIncluded) {
            prevBarBgColors.push('rgba(93, 173, 226, 0.78)');
            prevBarBorderColors.push('rgba(41, 128, 185, 1)');
          } else {
            // Uncalculated month (ปีปัจจุบันยังไม่มีข้อมูล) -> Yellow/Amber
            prevBarBgColors.push('rgba(244, 208, 63, 0.88)');
            prevBarBorderColors.push('rgba(212, 172, 13, 1)');
          }
        }
      }

      datasets.push({
        type: 'bar',
        label: 'ปี ' + prevItem.year,
        data: prevItem.months || [],
        backgroundColor: prevBarBgColors,
        borderColor: prevBarBorderColors,
        borderWidth: 1.5,
        borderRadius: 4,
        order: 2, // Layered behind
        datalabels: {
          anchor: 'end',
          align: 'top',
          offset: function(ctx) {
            const m = ctx.dataIndex;
            const v0 = parseFloat(prevItem.months ? prevItem.months[m] : 0) || 0;
            const v1 = parseFloat(currItem.months ? currItem.months[m] : 0) || 0;
            const maxV = Math.max(v0, v1);
            // If both bars have values and are close in height (< 25% diff), stagger the back bar label higher
            if (v0 > 0 && v1 > 0 && maxV > 0 && Math.abs(v0 - v1) / maxV < 0.25) {
              return 20; // Raised higher above the front bar label
            }
            return 3;
          },
          color: function(ctx) {
            const m = ctx.dataIndex;
            const isIncluded = comp ? comp.recordedMonthsIndices.includes(m) : true;
            return isIncluded ? '#1b4f72' : '#7d6608'; // Dark gold/amber text for uncalculated months
          },
          backgroundColor: function(ctx) {
            const m = ctx.dataIndex;
            const isIncluded = comp ? comp.recordedMonthsIndices.includes(m) : true;
            return isIncluded ? 'rgba(255, 255, 255, 0.92)' : 'rgba(254, 249, 231, 0.96)'; // Light yellow pill background
          },
          borderColor: function(ctx) {
            const m = ctx.dataIndex;
            const isIncluded = comp ? comp.recordedMonthsIndices.includes(m) : true;
            return isIncluded ? '#aed6f1' : '#f5b041'; // Amber border
          },
          borderWidth: 1,
          borderRadius: 3,
          padding: { top: 1, bottom: 1, left: 3, right: 3 },
          font: { size: 10, weight: 'bold', family: "'Kanit', sans-serif" },
          formatter: (v) => v > 0 ? Number(v).toLocaleString() : ''
        }
      });
    }
    
    datasets.push({
      type: 'bar',
      label: 'ปี ' + currItem.year,
      data: currItem.months || [],
      backgroundColor: 'rgba(82, 190, 128, 0.95)',
      borderColor: 'rgba(39, 174, 96, 1)',
      borderWidth: 1.5,
      borderRadius: 4,
      order: 1, // Layered in front
      datalabels: {
        anchor: 'end',
        align: 'top',
        offset: 3,
        color: '#0e6251',
        backgroundColor: 'rgba(255, 255, 255, 0.92)',
        borderColor: '#a3e4d7',
        borderWidth: 1,
        borderRadius: 3,
        padding: { top: 1, bottom: 1, left: 3, right: 3 },
        font: { size: 10.5, weight: 'bold', family: "'Kanit', sans-serif" },
        formatter: (v) => v > 0 ? Number(v).toLocaleString() : ''
      }
    });

    // Add Line Datasets for Other Years (if any)
    otherItems.forEach((otherItem, idx) => {
      const pal = OTHER_YEAR_LINE_PALETTES[idx % OTHER_YEAR_LINE_PALETTES.length];
      datasets.push({
        type: 'line',
        label: 'ปี ' + otherItem.year,
        data: otherItem.months || [],
        borderColor: pal.border,
        backgroundColor: pal.bg,
        borderWidth: 2.2,
        borderDash: [5, 4],
        pointRadius: 4,
        pointHoverRadius: 6.5,
        pointBackgroundColor: pal.point,
        pointBorderColor: '#ffffff',
        pointBorderWidth: 2,
        tension: 0.3,
        order: 0, // Render in front of bars
        datalabels: {
          display: false
        }
      });
    });
    
    // Custom Chart.js Plugin for exact 30% horizontal bar overlapping
    const overlap30Plugin = {
      id: 'overlap30Plugin',
      beforeDatasetsDraw(chart) {
        const barMetas = chart.data.datasets
          .map((ds, idx) => ({ ds, meta: chart.getDatasetMeta(idx) }))
          .filter(d => (!d.ds.type || d.ds.type === 'bar'));
        if (barMetas.length < 2) return;
        const meta0 = barMetas[0].meta; // Base Bar (Blue)
        const meta1 = barMetas[1].meta; // Target Bar (Green)
        if (!meta0 || !meta1 || !meta0.data || !meta1.data) return;
        
        const len = Math.min(meta0.data.length, meta1.data.length);
        for (let i = 0; i < len; i++) {
          const b0 = meta0.data[i];
          const b1 = meta1.data[i];
          if (b0 && b1) {
            const center = chart.scales.x.getPixelForTick(i);
            const barW = Math.min(Math.max(chart.width / 32, 18), 30);
            b0.width = barW;
            b1.width = barW;
            
            // 30% overlap: Distance between centers = 70% of bar width
            const shift = (barW * 0.7) / 2;
            b0.x = center - shift; // Back bar (ปีก่อนหน้า เช่น 2568) shifted LEFT
            b1.x = center + shift; // Front bar (ปีเปรียบเทียบ เช่น 2569) shifted RIGHT (overlaps 30% in front)
          }
        }
      }
    };
    
    // Calculate max value in data to set Y-axis max +30%
    let maxMonthlyVal = 0;
    if (prevItem && Array.isArray(prevItem.months)) {
      prevItem.months.forEach(v => {
        const num = parseFloat(v) || 0;
        if (num > maxMonthlyVal) maxMonthlyVal = num;
      });
    }
    if (currItem && Array.isArray(currItem.months)) {
      currItem.months.forEach(v => {
        const num = parseFloat(v) || 0;
        if (num > maxMonthlyVal) maxMonthlyVal = num;
      });
    }
    otherItems.forEach(item => {
      if (item && Array.isArray(item.months)) {
        item.months.forEach(v => {
          const num = parseFloat(v) || 0;
          if (num > maxMonthlyVal) maxMonthlyVal = num;
        });
      }
    });
    const yAxisMax = maxMonthlyVal > 0 ? (maxMonthlyVal * 1.30) : undefined;

    monthlyDetailChartInstance = new Chart(ctx, {
      type: 'bar',
      plugins: isSingleYear ? [] : [overlap30Plugin],
      data: {
        labels: MONTH_SHORT_LABELS,
        datasets: datasets
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        grouped: false,
        datasets: {

          }

          padding: { top: 25, bottom: 5, left: 10, right: 10 }
        },
        interaction: {
          mode: 'index',
          intersect: false
        },
        plugins: {
