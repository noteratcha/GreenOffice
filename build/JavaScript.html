<script>
// ============================================================
// Green Office - Client Side Logic
// ============================================================

// State
let currentUser = null;
let currentRole = null;
let uploadFiles = [];
let carouselImages = [];
let currentSlide = 0;
let carouselInterval = null;

// Initialize
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('currentYear').textContent = new Date().getFullYear();
  
  // Mobile Nav Toggle
  const hamburger = document.getElementById('navHamburger');
  const navCenter = document.getElementById('navCenter');
  hamburger.addEventListener('click', () => {
    hamburger.classList.toggle('active');
    navCenter.classList.toggle('open');
  });

  // Fix native anchor links inside iframe
  document.querySelectorAll('.nav-link').forEach(link => {
    link.addEventListener('click', function(e) {
      const targetId = this.getAttribute('href');
      if (targetId && targetId.startsWith('#')) {
        e.preventDefault();
        const targetElement = document.querySelector(targetId);
        if (targetElement) {
          targetElement.scrollIntoView({ behavior: 'smooth' });
          document.querySelectorAll('.nav-link').forEach(nav => nav.classList.remove('active'));
          this.classList.add('active');
          
          // Close mobile menu if open
          hamburger.classList.remove('active');
          navCenter.classList.remove('open');
        }
      }
    });
  });

  // Check saved session
  const savedUser = localStorage.getItem('go_user');
  const savedRole = localStorage.getItem('go_role');
  if (savedUser) {
    setUserSession(savedUser, savedRole);
  }

  // Load Data
  loadImages();
  loadNews();
  
  // Drag & Drop
  setupDragAndDrop();
});

// ============================================================
// Authentication
// ============================================================

function handleLogin(e) {
  e.preventDefault();
  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value.trim();
  const btn = document.getElementById('btnLoginSubmit');
  const errorMsg = document.getElementById('loginError');
  
  if(!user || !pass) return;
  
  btn.disabled = true;
  btn.innerHTML = 'กำลังเข้าสู่ระบบ...';
  errorMsg.classList.add('hidden');
  
  google.script.run
    .withSuccessHandler((res) => {
      btn.disabled = false;
      btn.innerHTML = 'เข้าสู่ระบบ';
      if (res.success) {
        setUserSession(res.user, res.role);
        closeModal('loginModal');
        showToast('เข้าสู่ระบบสำเร็จ', 'success');
        document.getElementById('loginForm').reset();
      } else {
        errorMsg.classList.remove('hidden');
        document.getElementById('loginErrorMsg').textContent = res.message;
      }
    })
    .withFailureHandler((err) => {
      btn.disabled = false;
      btn.innerHTML = 'เข้าสู่ระบบ';
      errorMsg.classList.remove('hidden');
      document.getElementById('loginErrorMsg').textContent = 'เชื่อมต่อล้มเหลว';
    })
    .checkLogin(user, pass);
}

function setUserSession(username, role) {
  currentUser = username;
  currentRole = role;
  localStorage.setItem('go_user', username);
  if(role) localStorage.setItem('go_role', role);
  
  document.getElementById('btnNavLogin').classList.add('hidden');
  document.getElementById('navUserInfo').classList.remove('hidden');
  document.getElementById('userNameDisplay').textContent = username;
  document.getElementById('userAvatarIcon').textContent = username.charAt(0).toUpperCase();
  
  document.getElementById('fabContainer').classList.remove('hidden');
  
  if (role === 'admin' || username.toLowerCase() === 'admin') {
    document.getElementById('fabUpload').classList.remove('hidden');
    document.getElementById('fabAddNews').classList.remove('hidden');
    document.getElementById('fabManagePhotos').classList.remove('hidden');
  } else {
    document.getElementById('fabUpload').classList.add('hidden');
    document.getElementById('fabAddNews').classList.add('hidden');
    document.getElementById('fabManagePhotos').classList.add('hidden');
  }
}

function logout() {
  currentUser = null;
  currentRole = null;
  localStorage.removeItem('go_user');
  localStorage.removeItem('go_role');
  
  document.getElementById('btnNavLogin').classList.remove('hidden');
  document.getElementById('navUserInfo').classList.add('hidden');
  document.getElementById('fabContainer').classList.add('hidden');
  
  showToast('ออกจากระบบแล้ว', 'success');
}

// ============================================================
// Carousel & Images
// ============================================================

function loadImages() {
  google.script.run
    .withSuccessHandler((images) => {
      carouselImages = images;
      renderCarousel();
      
      // Hide loading screen after initial load
      setTimeout(() => {
        document.getElementById('loadingScreen').classList.add('hidden');
      }, 500);
    })
    .withFailureHandler((err) => {
      console.error(err);
      document.getElementById('carouselContainer').innerHTML = '<div class="carousel-empty">โหลดรูปภาพล้มเหลว</div>';
      document.getElementById('loadingScreen').classList.add('hidden');
    })
    .getImages();
}

function renderCarousel() {
  const container = document.getElementById('carouselContainer');
  const dotsContainer = document.getElementById('carouselDots');
  
  if (!carouselImages || carouselImages.length === 0) {
    container.innerHTML = '<div class="carousel-empty"><span class="material-icons">photo_library</span><p>ยังไม่มีรูปภาพกิจกรรม</p></div>';
    dotsContainer.innerHTML = '';
    return;
  }
  
  let html = '';
  let dotsHtml = '';
  
  carouselImages.forEach((img, index) => {
    const dateStr = new Date(img.date).toLocaleDateString('th-TH', { 
      year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
    });
    
    html += `
      <div class="carousel-slide" id="slide-${index}">
        <img src="${img.url}" alt="${img.name}" loading="lazy">
      </div>
    `;
    dotsHtml += `<button class="carousel-dot" onclick="goToSlide(${index})"></button>`;
  });
  
  container.innerHTML = html;
  
  // Show up to 10 dots max to prevent overflow
  if (carouselImages.length <= 15) {
    dotsContainer.innerHTML = dotsHtml;
  } else {
    dotsContainer.innerHTML = '';
  }
  
  goToSlide(0);
}

function goToSlide(index) {
  if (index < 0 || index >= carouselImages.length) return;
  currentSlide = index;
  
  const prevIdx = currentSlide === 0 ? carouselImages.length - 1 : currentSlide - 1;
  const nextIdx = currentSlide === carouselImages.length - 1 ? 0 : currentSlide + 1;
  
  document.querySelectorAll('.carousel-slide').forEach((slide, idx) => {
    slide.className = 'carousel-slide'; // reset
    slide.onclick = null;
    
    if (idx === currentSlide) {
      slide.classList.add('active');
      slide.style.cursor = 'zoom-in';
      slide.onclick = () => {
        const img = carouselImages[currentSlide];
        if (img) openPhotoPreview(img.url, currentSlide, img.id);
      };
    } else if (idx === prevIdx && carouselImages.length > 1) {
      slide.classList.add('prev');
      slide.style.cursor = 'pointer';
      slide.onclick = () => goToSlide(prevIdx);
    } else if (idx === nextIdx && carouselImages.length > 2) {
      slide.classList.add('next');
      slide.style.cursor = 'pointer';
      slide.onclick = () => goToSlide(nextIdx);
    } else if (idx === nextIdx && carouselImages.length === 2) {
      // If only 2 images, next and prev are the same
      slide.classList.add('next');
      slide.style.cursor = 'pointer';
      slide.onclick = () => goToSlide(nextIdx);
    }
  });

  document.querySelectorAll('.carousel-dot').forEach((dot, idx) => {
    if (idx === currentSlide) dot.classList.add('active');
    else dot.classList.remove('active');
  });
  
  // Reset timer
  startCarousel();
}

function nextSlide() {
  let next = currentSlide + 1;
  if (next >= carouselImages.length) next = 0;
  goToSlide(next);
}

function prevSlide() {
  let prev = currentSlide - 1;
  if (prev < 0) prev = carouselImages.length - 1;
  goToSlide(prev);
}

function updateCounter() {
  // Not used anymore
}

function startCarousel() {
  clearInterval(carouselInterval);
  if (carouselImages.length > 1) {
    carouselInterval = setInterval(nextSlide, 5000);
  }
}

function deletePhoto(fileId, event) {
  event.stopPropagation();
  
  const btn = event.currentTarget;
  btn.disabled = true;
  btn.innerHTML = '<span class="material-icons" style="font-size: 20px; animation: spin 1s linear infinite;">autorenew</span>';
  
  google.script.run
    .withSuccessHandler((res) => {
      if (res.success) {
        showToast('ลบรูปภาพสำเร็จ', 'success');
        // Remove from local array to update UI immediately
        carouselImages = carouselImages.filter(img => img.id !== fileId);
        renderManagePhotos(); // Update modal
        renderCarousel();     // Update carousel
      } else {
        showToast(res.message, 'error');
        btn.disabled = false;
        btn.innerHTML = '<span class="material-icons" style="font-size: 20px;">delete</span>';
      }
    })
    .withFailureHandler((err) => {
      showToast('การเชื่อมต่อล้มเหลว', 'error');
      btn.disabled = false;
      btn.innerHTML = '<span class="material-icons" style="font-size: 20px;">delete</span>';
    })
    .deleteImage(fileId);
}

function openPhotoPreview(url, index, fileId) {
  if (!url) return;
  const fullUrl = url.replace('&sz=w600', '&sz=w1600').replace('&sz=w1200', '&sz=w1600');
  document.getElementById('photoPreviewImg').src = fullUrl;
  
  const numElem = document.getElementById('photoPreviewNumber');
  if (numElem) {
    if (typeof index === 'number' && index >= 0) {
      numElem.innerText = index + 1;
      numElem.style.display = 'block';
    } else {
      numElem.style.display = 'none';
    }
  }

  const delBtn = document.getElementById('photoPreviewDeleteBtn');
  if (delBtn) {
    if (fileId && currentRole === 'admin') {
      delBtn.style.display = 'flex';
      delBtn.onclick = (e) => {
        deletePhoto(fileId, e);
        closeModal('photoPreviewModal');
      };
    } else {
      delBtn.style.display = 'none';
    }
  }
  openModal('photoPreviewModal');
}

function openManagePhotos() {
  renderManagePhotos();
  openModal('managePhotosModal');
}

function renderManagePhotos() {
  const container = document.getElementById('managePhotosGrid');
  if (!carouselImages || carouselImages.length === 0) {
    container.innerHTML = '<div class="news-empty">ไม่มีรูปภาพให้จัดการ</div>';
    return;
  }
  
  let html = '';
  carouselImages.forEach((img, index) => {
    const dateStr = new Date(img.date).toLocaleDateString('th-TH', { 
      year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
    });
    
    html += `
      <div class="manage-photo-item">
        <div class="manage-photo-number">${index + 1}</div>
        <img src="${img.url}" class="manage-photo-img" loading="lazy" onclick="openPhotoPreview('${img.url}', ${index}, '${img.id}')">
        <button class="manage-photo-btn" onclick="deletePhoto('${img.id}', event)" title="ลบรูปนี้">
          <span class="material-icons" style="font-size: 16px;">delete</span>
        </button>
        <div class="manage-photo-info">
          <div class="info-details">
            <div class="info-filename" title="${img.name}">${img.name}</div>
            <div class="info-date">${dateStr}</div>
          </div>
        </div>
      </div>
    `;
  });
  
  container.innerHTML = html;
}

// ============================================================
// Upload Images
// ============================================================

function setupDragAndDrop() {
  const zone = document.getElementById('uploadZone');
  
  zone.addEventListener('dragover', (e) => {
    e.preventDefault();
    zone.classList.add('dragover');
  });
  
  zone.addEventListener('dragleave', (e) => {
    e.preventDefault();
    zone.classList.remove('dragover');
  });
  
  zone.addEventListener('drop', (e) => {
    e.preventDefault();
    zone.classList.remove('dragover');
    if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
      processFiles(e.dataTransfer.files);
    }
  });
}

function handleFileSelect(e) {
  if (e.target.files && e.target.files.length > 0) {
    processFiles(e.target.files);
  }
}

function processFiles(files) {
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    if (!file.type.match('image.*')) {
      showToast('กรุณาเลือกไฟล์รูปภาพเท่านั้น', 'error');
      continue;
    }
    
    // File size limit (approx 5MB per file for base64 safety)
    if (file.size > 5 * 1024 * 1024) {
      showToast(`ไฟล์ ${file.name} มีขนาดใหญ่เกินไป (สูงสุด 5MB)`, 'error');
      continue;
    }

    const reader = new FileReader();
    reader.onload = (e) => {
      uploadFiles.push({
        file: file,
        dataUrl: e.target.result
      });
      renderUploadPreview();
    };
    reader.readAsDataURL(file);
  }
}

function renderUploadPreview() {
  const container = document.getElementById('uploadPreview');
  const btn = document.getElementById('btnUploadSubmit');
  const count = document.getElementById('uploadCount');
  
  if (uploadFiles.length === 0) {
    container.innerHTML = '';
    btn.disabled = true;
    count.textContent = '(0)';
    return;
  }
  
  let html = '';
  uploadFiles.forEach((item, index) => {
    html += `
      <div class="upload-preview-item">
        <img src="${item.dataUrl}">
        <button class="upload-preview-remove" onclick="removeUploadFile(${index})">
          <span class="material-icons" style="font-size: 14px;">close</span>
        </button>
      </div>
    `;
  });
  
  container.innerHTML = html;
  btn.disabled = false;
  count.textContent = `(${uploadFiles.length})`;
}

function removeUploadFile(index) {
  uploadFiles.splice(index, 1);
  renderUploadPreview();
}

function submitUpload() {
  if (uploadFiles.length === 0 || !currentUser) return;
  
  const btn = document.getElementById('btnUploadSubmit');
  const progress = document.getElementById('uploadProgress');
  const closeBtn = document.querySelector('#uploadModal .modal-close');
  
  btn.disabled = true;
  closeBtn.disabled = true;
  progress.classList.add('show');
  btn.innerHTML = 'กำลังอัปโหลด...';
  
  // Extract base64 data (remove data:image/jpeg;base64,)
  const payload = uploadFiles.map(item => {
    const parts = item.dataUrl.split(',');
    return {
      data: parts[1],
      mimeType: item.file.type
    };
  });
  
  google.script.run
    .withSuccessHandler((res) => {
      btn.disabled = false;
      closeBtn.disabled = false;
      progress.classList.remove('show');
      
      if (res.success) {
        showToast(`อัปโหลดสำเร็จ ${res.count} รูป`, 'success');
        uploadFiles = [];
        document.getElementById('fileInput').value = '';
        renderUploadPreview();
        closeModal('uploadModal');
        // Reload carousel
        loadImages();
      } else {
        showToast(res.message, 'error');
        btn.innerHTML = `อัปโหลด (${uploadFiles.length})`;
      }
    })
    .withFailureHandler((err) => {
      btn.disabled = false;
      closeBtn.disabled = false;
      progress.classList.remove('show');
      btn.innerHTML = `อัปโหลด (${uploadFiles.length})`;
      showToast('การเชื่อมต่อล้มเหลว', 'error');
    })
    .uploadImages(payload, currentUser);
}

// ============================================================
// News Section
// ============================================================

let globalNewsData = [];
let currentNewsPage = 1;
const newsPerPage = 3;
let news3DSliderInterval = null;

function loadNews() {
  google.script.run
    .withSuccessHandler((news) => {
      globalNewsData = news;
      currentNewsPage = 1;
      renderNews();
    })
    .withFailureHandler((err) => {
      document.getElementById('newsGrid').innerHTML = '<div class="news-empty">โหลดข่าวสารล้มเหลว</div>';
    })
    .getNews();
}

function renderNews() {
  const container = document.getElementById('newsGrid');
  
  if (!globalNewsData || globalNewsData.length === 0) {
    container.innerHTML = `
      <div class="news-empty">
        <span class="material-icons">campaign</span>
        <p>ยังไม่มีข่าวสารกิจกรรมในขณะนี้</p>
      </div>`;
    const pag = document.getElementById('newsPagination');
    if(pag) pag.innerHTML = '';
    return;
  }

  const totalPages = Math.ceil(globalNewsData.length / newsPerPage);
  if (currentNewsPage > totalPages) currentNewsPage = totalPages;
  if (currentNewsPage < 1) currentNewsPage = 1;

  const startIndex = (currentNewsPage - 1) * newsPerPage;
  const endIndex = startIndex + newsPerPage;
  const pagedNews = globalNewsData.slice(startIndex, endIndex);
  
  let html = '';
  pagedNews.forEach((news, idx) => {
    let imgHtml = '';
    if (news.imageUrls && news.imageUrls.length > 0) {
      if (news.imageUrls.length === 1) {
        imgHtml = `<img src="${news.imageUrls[0]}" class="news-card-image" loading="lazy">`;
      } else {
        imgHtml = `<div class="news-card-3d-slider">`;
        news.imageUrls.forEach((url, i) => {
          imgHtml += `<img src="${url}" class="news-slide ${i === 0 ? 'active' : ''}" loading="lazy">`;
        });
        imgHtml += `</div>`;
      }
    } else {
      imgHtml = `<div class="news-card-image" style="display:flex;align-items:center;justify-content:center;background:var(--color-sage);"><span class="material-icons" style="font-size:3rem;color:white;">photo</span></div>`;
    }
      
    html += `
      <div class="news-card" style="animation-delay: ${idx * 0.1}s" onclick="openNewsDetail(${globalNewsData.indexOf(news)})">
        ${imgHtml}
        <div class="news-card-body">
          <div class="news-card-date"><span class="material-icons" style="font-size:14px;">calendar_today</span> ${formatNewsDate(news.date)}${news.user || news.author ? ' โดย ' + (news.user || news.author) : ''}</div>
          <h3 class="news-card-title">${news.title}</h3>
          <p class="news-card-content">${news.content}</p>
        </div>
      </div>
    `;
  });
  
  container.innerHTML = html;
  renderNewsPagination(totalPages);
  
  // Initialize 3D Slider animation: Sequential left to right with 3-second delay
  if (news3DSliderInterval) clearInterval(news3DSliderInterval);
  let currentSliderTurn = 0;

  news3DSliderInterval = setInterval(() => {
    const sliders = document.querySelectorAll('.news-card-3d-slider');
    if (sliders.length === 0) return;

    const currentSlider = sliders[currentSliderTurn % sliders.length];
    const slides = currentSlider.querySelectorAll('.news-slide');
    if (slides.length > 1) {
      let activeIdx = -1;
      slides.forEach((s, i) => { if (s.classList.contains('active')) activeIdx = i; });

      if (activeIdx !== -1) {
        slides[activeIdx].classList.remove('active');
        slides[activeIdx].classList.add('prev');
        slides.forEach((s, i) => {
          if (i !== activeIdx && s.classList.contains('prev')) s.classList.remove('prev');
        });
        let nextIdx = (activeIdx + 1) % slides.length;
        slides[nextIdx].classList.add('active');
      }
    }

    currentSliderTurn = (currentSliderTurn + 1) % sliders.length;
  }, 3000);
}

function renderNewsPagination(totalPages) {
  let paginationContainer = document.getElementById('newsPagination');
  if (!paginationContainer) {
    paginationContainer = document.createElement('div');
    paginationContainer.id = 'newsPagination';
    paginationContainer.className = 'pagination-container';
    const newsSection = document.getElementById('newsGrid').parentElement;
    newsSection.appendChild(paginationContainer);
  }

  if (totalPages <= 1) {
    paginationContainer.innerHTML = '';
    return;
  }

  let html = `<button class="btn-pagination" onclick="changeNewsPage(${currentNewsPage - 1})" ${currentNewsPage === 1 ? 'disabled' : ''}><span class="material-icons">chevron_left</span> ก่อนหน้า</button>`;
  html += `<span class="pagination-info">หน้า ${currentNewsPage} จาก ${totalPages}</span>`;
  html += `<button class="btn-pagination" onclick="changeNewsPage(${currentNewsPage + 1})" ${currentNewsPage === totalPages ? 'disabled' : ''}>ถัดไป <span class="material-icons">chevron_right</span></button>`;

  paginationContainer.innerHTML = html;
}

function changeNewsPage(newPage) {
  currentNewsPage = newPage;
  renderNews();
  document.getElementById('news').scrollIntoView({ behavior: 'smooth' });
}

function processFilesToBase64(files, maxDimension = 1280, quality = 0.75) {
  const promises = Array.from(files).map(file => {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let width = img.width;
          let height = img.height;
          if (width > maxDimension || height > maxDimension) {
            if (width > height) {
              height = Math.round((height * maxDimension) / width);
              width = maxDimension;
            } else {
              width = Math.round((width * maxDimension) / height);
              height = maxDimension;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL('image/jpeg', quality);
          resolve({
            data: dataUrl.split(',')[1],
            mimeType: 'image/jpeg'
          });
        };
        img.onerror = () => {
          resolve({
            data: e.target.result.split(',')[1],
            mimeType: file.type || 'image/jpeg'
          });
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  });
  return Promise.all(promises);
}

async function submitNews(e) {
  e.preventDefault();
  
  const title = document.getElementById('newsTitle').value;
  const content = document.getElementById('newsContent').value;
  const fileInput = document.getElementById('newsImage');
  const btn = document.getElementById('btnNewsSubmit');
  const progress = document.getElementById('newsProgress');
  
  if (!title || !content) return;
  
  btn.disabled = true;
  progress.classList.add('show');
  
  let imagesData = [];
  if (fileInput.files && fileInput.files.length > 0) {
    try {
      imagesData = await processFilesToBase64(fileInput.files);
    } catch(err) {
      console.error('Error processing images:', err);
    }
  }
  
  google.script.run
    .withSuccessHandler((res) => {
      btn.disabled = false;
      progress.classList.remove('show');
      
      if (res.success) {
        showToast(res.message || 'เพิ่มข่าวสารสำเร็จ', 'success');
        document.getElementById('newsForm').reset();
        closeModal('newsModal');
        loadNews();
      } else {
        showToast(res.message, 'error');
      }
    })
    .withFailureHandler((err) => {
      btn.disabled = false;
      progress.classList.remove('show');
      showToast('การเชื่อมต่อล้มเหลว: ' + (err.message || ''), 'error');
    })
    .addNews(title, content, imagesData, currentUser);
}

// ============================================================
// News Detail, Edit & Delete
// ============================================================
function openNewsDetail(idx) {
  const news = globalNewsData[idx];
  if (!news) return;

  const imgContainer = document.getElementById('newsDetailImageContainer');
  const leftCol = document.getElementById('newsDetailLeft');
  const layout = document.getElementById('newsDetailLayout');

  if (news.imageUrls && news.imageUrls.length > 0) {
    if (leftCol) leftCol.style.display = 'flex';
    if (layout) layout.style.gridTemplateColumns = '';

    if (news.imageUrls.length === 1) {
      imgContainer.innerHTML = `<img src="${news.imageUrls[0]}" style="cursor: zoom-in;" onclick="openPhotoPreview('${news.imageUrls[0]}')">`;
    } else {
      let html = `
        <div class="news-gallery-main">
          <img id="newsGalleryMainImg" src="${news.imageUrls[0]}" style="cursor: zoom-in;" onclick="openPhotoPreview(this.src)">
        </div>
        <div class="news-gallery-thumbs">
      `;
      news.imageUrls.forEach((url, i) => {
        html += `<img src="${url}" class="news-thumb ${i === 0 ? 'active' : ''}" onclick="setNewsGalleryMain('${url}', this)">`;
      });
      html += '</div>';
      imgContainer.innerHTML = html;
    }
  } else {
    if (leftCol) leftCol.style.display = 'none';
    if (layout) layout.style.gridTemplateColumns = '1fr';
    imgContainer.innerHTML = '';
  }

  const newsAuthor = news.user || news.author || '';
  document.getElementById('newsDetailDate').innerHTML = `<span class="material-icons" style="font-size:16px;">calendar_today</span> <span>${formatNewsDate(news.date)}${newsAuthor ? ' โดย ' + newsAuthor : ''}</span>`;
  document.getElementById('newsDetailTitle').textContent = news.title;
  document.getElementById('newsDetailContent').textContent = news.content;

  const actionBar = document.getElementById('newsDetailActionBar');
  if (currentUser && (newsAuthor === currentUser || currentRole === 'admin')) {
    actionBar.classList.remove('hidden');
    document.getElementById('btnEditNewsAction').onclick = () => {
      closeModal('newsDetailModal');
      openEditNews(idx);
    };
    document.getElementById('btnDeleteNewsAction').onclick = () => {
      if (confirm('คุณต้องการลบข่าวสารนี้ใช่หรือไม่?')) {
        deleteNewsItem(idx);
      }
    };
  } else {
    actionBar.classList.add('hidden');
  }

  openModal('newsDetailModal');
}

function setNewsGalleryMain(url, thumbElem) {
  document.getElementById('newsGalleryMainImg').src = url;
  const thumbs = document.querySelectorAll('.news-thumb');
  thumbs.forEach(t => t.classList.remove('active'));
  thumbElem.classList.add('active');
}

function formatNewsDate(dateVal) {
  if (!dateVal) return '';
  const thaiMonths = [
    'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
    'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'
  ];
  
  if (typeof dateVal === 'string') {
    const match = dateVal.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (match) {
      const day = parseInt(match[1]);
      const monthIdx = parseInt(match[2]) - 1;
      let year = parseInt(match[3]);
      if (year < 2500) year += 543;
      return `${day} ${thaiMonths[monthIdx] || match[2]} ${year}`;
    }
  }

  const d = new Date(dateVal);
  if (!isNaN(d.getTime())) {
    const day = d.getDate();
    const month = thaiMonths[d.getMonth()];
    let year = d.getFullYear();
    if (year < 2500) year += 543;
    return `${day} ${month} ${year}`;
  }

  return String(dateVal).split(' ')[0];
}

let editNewsImagesBase64 = [];
document.getElementById('editNewsImage').addEventListener('change', function(e) {
  editNewsImagesBase64 = [];
  const files = e.target.files;
  if (!files || files.length === 0) return;
  for(let i = 0; i < files.length; i++) {
    const file = files[i];
    const reader = new FileReader();
    reader.onload = (ev) => {
      editNewsImagesBase64.push({
        data: ev.target.result.split(',')[1],
        mimeType: file.type
      });
    };
    reader.readAsDataURL(file);
  }
});

function openEditNews(idx) {
  const news = globalNewsData[idx];
  if (!news) return;

  document.getElementById('editNewsRow').value = news.row;
  document.getElementById('editNewsTitle').value = news.title;
  document.getElementById('editNewsContent').value = news.content;
  document.getElementById('editNewsImage').value = '';
  editNewsImagesBase64 = [];

  openModal('editNewsModal');
}

async function submitEditNews(e) {
  e.preventDefault();
  const row = parseInt(document.getElementById('editNewsRow').value);
  const title = document.getElementById('editNewsTitle').value;
  const content = document.getElementById('editNewsContent').value;
  const fileInput = document.getElementById('editNewsImage');
  const btn = document.getElementById('btnEditNewsSubmit');
  const progress = document.getElementById('editNewsProgress');

  btn.disabled = true;
  progress.classList.add('show');

  let imagesData = [];
  if (fileInput.files && fileInput.files.length > 0) {
    try {
      imagesData = await processFilesToBase64(fileInput.files);
    } catch(err) {
      console.error('Error processing images for edit:', err);
    }
  }

  google.script.run
    .withSuccessHandler((res) => {
      btn.disabled = false;
      progress.classList.remove('show');
      if (res.success) {
        showToast('แก้ไขข่าวสารสำเร็จ', 'success');
        closeModal('editNewsModal');
        loadNews();
      } else {
        showToast(res.message, 'error');
      }
    })
    .withFailureHandler((err) => {
      btn.disabled = false;
      progress.classList.remove('show');
      showToast('การเชื่อมต่อล้มเหลว: ' + (err.message || ''), 'error');
    })
    .editNews(row, title, content, imagesData);
}

function deleteNewsItem(idx) {
  const news = globalNewsData[idx];
  if (!news) return;
  
  google.script.run
    .withSuccessHandler((res) => {
      if (res.success) {
        showToast('ลบข่าวสารสำเร็จ', 'success');
        closeModal('newsDetailModal');
        loadNews();
      } else {
        showToast(res.message, 'error');
      }
    })
    .withFailureHandler((err) => {
      showToast('การเชื่อมต่อล้มเหลว', 'error');
    })
    .deleteNews(news.row);
}

// ============================================================
// UI Utils
// ============================================================

function openModal(id) {
  document.getElementById(id).classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeModal(id) {
  document.getElementById(id).classList.remove('show');
  document.body.style.overflow = '';
}

// Close modal on click outside
window.addEventListener('click', (e) => {
  if (e.target.classList.contains('modal-backdrop')) {
    closeModal(e.target.id);
  }
});

function showToast(message, type = 'success') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  
  const icon = type === 'success' ? 'check_circle' : 'error';
  const color = type === 'success' ? 'var(--color-success)' : 'var(--color-error)';
  
  toast.innerHTML = `
    <span class="material-icons" style="color: ${color}">${icon}</span>
    <span>${message}</span>
  `;
  
  container.appendChild(toast);
  
  setTimeout(() => {
    toast.classList.add('hide');
    setTimeout(() => {
      container.removeChild(toast);
    }, 300);
  }, 3000);
}
